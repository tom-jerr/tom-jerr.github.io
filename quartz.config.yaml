# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 刘芷溢
  pageTitleSuffix: " · tom-jerr"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: google
    tagId: G-NKJWZM1JHX
  locale: zh-CN
  baseUrl: tom-jerr.github.io
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      title: JetBrains Mono
      header: JetBrains Mono
      body: JetBrains Mono
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#f2f2f2"
        gray: "#b8b8b8"
        darkgray: "#333333"
        dark: "#111111"
        secondary: "#3f51b5"
        tertiary: "#00897b"
        highlight: rgba(63, 81, 181, 0.12)
        textHighlight: "#fff59d"
      darkMode:
        light: "#161616"
        lightgray: "#242424"
        gray: "#686868"
        darkgray: "#e0e0e0"
        dark: "#ffffff"
        secondary: "#80cbc4"
        tertiary: "#9fa8da"
        highlight: rgba(128, 203, 196, 0.14)
        textHighlight: "#5d5400"

plugins:
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    order: 5

  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10

  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20

  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30

  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40

  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45

  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30

  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: relative
    order: 60

  - source: "@quartz-community/description"
    enabled: true
    order: 70

  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80

  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90

  - source: "@quartz-community/quartz-fonts"
    enabled: true

  - source: "@quartz-community/remove-draft"
    enabled: true

  - source: "@quartz-community/alias-redirects"
    enabled: true

  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
      rssLimit: 20
      rssFullHtml: false

  - source: "@quartz-community/favicon"
    enabled: true

  - source: "@quartz-community/og-image"
    enabled: true
    options:
      colorScheme: lightMode
      width: 1200
      height: 630
      excludeRoot: true

  - source: "@quartz-community/content-page"
    enabled: true

  - source: "@quartz-community/folder-page"
    enabled: true

  - source: "@quartz-community/tag-page"
    enabled: true

  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10

  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true

  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    layout:
      position: left
      priority: 25
      display: mobile-only

  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar

  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar

  - source: "@quartz-community/explorer"
    enabled: true
    options:
      title: 目录
      folderClickBehavior: link
      folderDefaultState: collapsed
      useSavedState: true
    layout:
      position: left
      priority: 50

  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      title: 最近更新
      limit: 8
      linkToMore: false
      showTags: true
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: left
      priority: 60

  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index

  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index

  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index

  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
      condition: not-index

  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10

  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50

  - source: "./plugins/utterances-comments"
    enabled: true
    options:
      repo: tom-jerr/blog-comments
      issueTerm: pathname
      label: comments
      lightTheme: github-light
      darkTheme: github-dark
    layout:
      position: afterBody
      priority: 10

  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/tom-jerr/
        X: https://x.com/tom_jerry_jack
        Zhihu: https://www.zhihu.com/people/chen-wen-de-jian-ke
        Email: mailto:tomlzy213@gmail.com
        RSS: /index.xml
    layout:
      position: footer
      priority: 50

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
