<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="596" viewBox="0 0 1120 596" role="img" aria-labelledby="title desc">
<title id="title">DSpark 训练：学候选分布，也学条件接受率</title><desc id="desc">SpecForge 使用真实前驱修正 logits，CE 与分布 L1 训练 q，分布重叠的 detach 值监督 confidence；STS 另用留出数据校准。</desc>
<style>text{font-family:Inter, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif;fill:#172033}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="1120" height="596" fill="white"/>
<text x="32" y="39" font-size="26" style="fill:#172033" text-anchor="start" font-weight="700">DSpark 训练：学候选分布，也学条件接受率</text>
<rect x="32" y="83" width="240" height="112" rx="10" fill="#F3F5F8" stroke="#CAD3E1" stroke-width="1.5"/>
<text x="152.0" y="115" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">训练序列 + anchor</text>
<text x="152.0" y="145" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">D 为 anchor</text>
<text x="152.0" y="170" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">真实后续 E F G H</text>
<rect x="304" y="83" width="240" height="112" rx="10" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="1.5"/>
<text x="424.0" y="115" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">冻结 target</text>
<text x="424.0" y="145" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">多层 hidden → context</text>
<text x="424.0" y="170" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">末层 hidden → teacher p</text>
<path d="M272,139 L299,139" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="576" y="83" width="240" height="112" rx="10" fill="#FFF2D6" stroke="#B47815" stroke-width="1.5"/>
<text x="696.0" y="115" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">Teacher forcing</text>
<text x="696.0" y="145" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">前驱 D E F G</text>
<text x="696.0" y="170" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">标签 E F G H</text>
<text x="863" y="117" font-size="20" style="fill:#172033" text-anchor="start" font-weight="400">推理时前驱换成</text>
<text x="863" y="148" font-size="20" style="fill:#172033" text-anchor="start" font-weight="400">刚选出的 draft token</text>
<path d="M152,195 L152,224" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M424,195 L424,224" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M696,195 L696,224" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M272,286 L299,286" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M544,286 L571,286" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M816,286 L843,286" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="230" width="240" height="112" rx="10" fill="#FFF2D6" stroke="#B47815" stroke-width="1.5"/>
<text x="152.0" y="262" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">构造 block</text>
<text x="152.0" y="292" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">D  M  M  M</text>
<text x="152.0" y="317" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">4 个 query → 4 个预测</text>
<rect x="304" y="230" width="240" height="112" rx="10" fill="#E2F5F1" stroke="#138A7E" stroke-width="1.5"/>
<text x="424.0" y="262" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">并行 backbone</text>
<text x="424.0" y="292" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">一次得到 h 与基础 U</text>
<text x="424.0" y="317" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">anchor 行也参与预测</text>
<rect x="576" y="230" width="240" height="112" rx="10" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5"/>
<text x="696.0" y="262" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">轻量序列头</text>
<text x="696.0" y="292" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">Markov / RNN 修正</text>
<text x="696.0" y="317" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">使用真实前驱</text>
<rect x="848" y="230" width="240" height="112" rx="10" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5"/>
<text x="968.0" y="262" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">训练输出</text>
<text x="968.0" y="292" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">修正后的分布 q</text>
<text x="968.0" y="317" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">confidence head 输出 c</text>
<path d="M968,342 L968,370 L196,370 L196,399" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M560,370 L560,399" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M924,370 L924,399" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="405" width="328" height="104" rx="10" fill="#F3F5F8" stroke="#CAD3E1" stroke-width="1.5"/>
<text x="196.0" y="437" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">Token CE</text>
<text x="196.0" y="467" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">真实标签与 q</text>
<text x="196.0" y="492" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">监督生成内容</text>
<rect x="396" y="405" width="328" height="104" rx="10" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="1.5"/>
<text x="560.0" y="437" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">分布 L1</text>
<text x="560.0" y="467" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">teacher p 与修正后的 q</text>
<text x="560.0" y="492" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">增大两者的概率重叠</text>
<rect x="760" y="405" width="328" height="104" rx="10" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5"/>
<text x="924.0" y="437" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">Confidence BCE</text>
<text x="924.0" y="467" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">目标 = detach(1 − TV(p,q))</text>
<text x="924.0" y="492" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">估计条件接受率</text>
<text x="32" y="552" font-size="19" style="fill:#637083" text-anchor="start" font-weight="400">三项按配置加权训练；训练后另用留出数据做 STS 校准，再提供给验证长度调度器。</text>
</svg>
