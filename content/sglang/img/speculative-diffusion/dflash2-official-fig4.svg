<svg viewBox="0 0 760 380" role="img" aria-label="Diagram of the two-tap dynamic convolution. Top: one drafter layer with a convolution before and after each attention and MLP sublayer, repeated five times. Bottom, zoomed into one convolution: each position takes one tap on itself and one on its predecessor, and the first position reads the last verified token." style="font-family:Arial,Helvetica,sans-serif;background:#faf9f7" xmlns="http://www.w3.org/2000/svg" width="760" height="380"><defs><marker id="cf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eea38b" /></marker><marker id="cf-arrow-faint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a171480" /></marker><marker id="cf-arrow-lane" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a171480" /></marker></defs><rect x="84" y="22" width="592" height="112" rx="13" fill="none" stroke="#1a17143d" stroke-width="1.5" stroke-dasharray="6 4" /><rect x="338" y="15" width="84" height="14" fill="#faf9f7" /><text x="380" y="26" text-anchor="middle" font-size="11.5" fill="#1a1714" letter-spacing="0.5">×5 layers</text><line x1="44" y1="78" x2="113" y2="78" stroke="#1a17145c" stroke-width="1.5" /><line x1="133" y1="78" x2="163" y2="78" stroke="#1a17145c" stroke-width="1.5" /><line x1="303" y1="78" x2="333" y2="78" stroke="#1a17145c" stroke-width="1.5" /><line x1="353" y1="78" x2="383" y2="78" stroke="#1a17145c" stroke-width="1.5" /><line x1="493" y1="78" x2="523" y2="78" stroke="#1a17145c" stroke-width="1.5" /><line x1="543" y1="78" x2="573" y2="78" stroke="#1a17145c" stroke-width="1.5" /><line x1="647" y1="78" x2="708" y2="78" stroke="#1a17145c" stroke-width="1.5" marker-end="url(#cf-arrow-lane)" /><rect x="118" y="44" width="10" height="68" rx="5" fill="#f7d6cb" stroke="#eea38b" /><g><rect x="168" y="50" width="130" height="56" rx="11" fill="#1a171409" stroke="#1a17143d" /><text x="233" y="78" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1a1714">Attention</text></g><rect x="338" y="44" width="10" height="68" rx="5" fill="#eea38b73" stroke="#eea38b" /><g><rect x="388" y="50" width="100" height="56" rx="11" fill="#1a171409" stroke="#1a17143d" /><text x="438" y="78" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1a1714">MLP</text></g><rect x="528" y="44" width="10" height="68" rx="5" fill="#f7d6cb" stroke="#eea38b" /><g><rect x="578" y="50" width="64" height="56" rx="11" fill="#1a171409" stroke="#1a17143d" /><text x="610" y="78" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1a1714">…</text></g><line x1="338" y1="114" x2="96" y2="196" stroke="#1a171426" stroke-width="1.2" stroke-dasharray="3 4" /><line x1="348" y1="114" x2="664" y2="196" stroke="#1a171426" stroke-width="1.2" stroke-dasharray="3 4" /><rect x="96" y="196" width="568" height="172" rx="13" fill="#1a171406" stroke="#1a17143d" /><text x="116" y="224" font-size="13.5"><tspan fill="#1a1714" font-weight="600">Inside one conv</tspan><tspan fill="#1a1714"> — every position takes two taps</tspan></text><text x="108" y="257" dominant-baseline="central" font-size="12" font-style="italic" fill="#1a1714">x</text><text x="108" y="327" dominant-baseline="central" font-size="12" font-style="italic" fill="#1a1714">Conv(x)</text><g><rect x="166" y="240" width="96" height="34" rx="8" fill="#f7edd8" stroke="#b28a2c80" /><text x="214" y="257" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#96762e">verified</text><g><rect x="290" y="240" width="96" height="34" rx="8" fill="#5a967821" stroke="#5a967899" /><text x="338" y="257" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#46795f">pos 1</text></g><g><rect x="414" y="240" width="96" height="34" rx="8" fill="#5a967