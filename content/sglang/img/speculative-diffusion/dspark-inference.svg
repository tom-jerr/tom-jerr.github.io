<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
<title id="title">DSpark 推理：重计算并行，串行只留给轻量头</title><desc id="desc">先并行得到各位置表示，轻量序列头按已选前驱生成候选与 confidence；调度器裁剪后缀，target 验证保留前缀。</desc>
<style>text{font-family:Inter, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif;fill:#172033}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="1120" height="520" fill="white"/>
<text x="32" y="39" font-size="26" style="fill:#172033" text-anchor="start" font-weight="700">DSpark 推理：重计算并行，串行只留给轻量头</text>
<text x="32" y="80" font-size="19" style="fill:#637083" text-anchor="start" font-weight="400">沿用论文 Figure 1 的示例：已有 A B C，anchor 为 D；候选 E F G H。</text>
<path d="M272,189 L299,189" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M544,189 L571,189" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M816,189 L843,189" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="128" width="240" height="122" rx="10" fill="#E2F5F1" stroke="#138A7E" stroke-width="1.5"/>
<text x="152.0" y="160" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">并行 backbone</text>
<text x="152.0" y="190" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">输入 D M M M</text>
<text x="152.0" y="215" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">一次生成所有 h 与 U</text>
<rect x="304" y="128" width="240" height="122" rx="10" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5"/>
<text x="424.0" y="160" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">轻量串行头</text>
<text x="424.0" y="190" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">D → E → F → G → H</text>
<text x="424.0" y="215" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">保存修正 q 与 confidence</text>
<rect x="576" y="128" width="240" height="122" rx="10" fill="#FFF2D6" stroke="#B47815" stroke-width="1.5"/>
<text x="696.0" y="160" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">决定验证长度</text>
<text x="696.0" y="190" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">confidence + 成本曲线</text>
<text x="696.0" y="215" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">每请求保留一个前缀</text>
<rect x="848" y="128" width="240" height="122" rx="10" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="1.5"/>
<text x="968.0" y="160" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">Target verify</text>
<text x="968.0" y="190" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">仅验证调度后的前缀</text>
<text x="968.0" y="215" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">提交接受结果与新 anchor</text>
<text x="32" y="313" font-size="20" style="fill:#172033" text-anchor="start" font-weight="650">调度示例</text>
<rect x="152" y="285" width="44" height="40" rx="6" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5"/>
<text x="174.0" y="312" font-size="20" style="fill:#172033" text-anchor="middle" font-weight="600">E</text>
<rect x="206" y="285" width="44" height="40" rx="6" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5"/>
<text x="228.0" y="312" font-size="20" style="fill:#172033" text-anchor="middle" font-weight="600">F</text>
<rect x="260" y="285" width="44" height="40" rx="6" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5"/>
<text x="282.0" y="312" font-size="20" style="fill:#172033" text-anchor="middle" font-weight="600">G</text>
<rect x="314" y="285" width="44" height="40" rx="6" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5"/>
<text x="336.0" y="312" font-size="20" style="fill:#172033" text-anchor="middle" font-weight="600">H</text>
<path d="M376,306 L424,306" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="448" y="285" width="44" height="40" rx="6" fill="#E4F4EA" stroke="#2E8B57" stroke-width="1.5"/>
<text x="470.0" y="312" font-size="20" style="fill:#172033" text-anchor="middle" font-weight="600">E</text>
<rect x="502" y="285" width="44" height="40" rx="6" fill="#E4F4EA" stroke="#2E8B57" stroke-width="1.5"/>
<text x="524.0" y="312" font-size="20" style="fill:#172033" text-anchor="middle" font-weight="600">F</text>
<rect x="556" y="285" width="44" height="40" rx="6" fill="#E4F4EA" stroke="#2E8B57" stroke-width="1.5"/>
<text x="578.0" y="312" font-size="20" style="fill:#172033" text-anchor="middle" font-weight="600">G</text>
<rect x="644" y="285" width="44" height="40" rx="6" fill="#F3F5F8" stroke="#CAD3E1" stroke-width="1.5"/>
<text x="666.0" y="312" font-size="20" style="fill:#172033" text-anchor="middle" font-weight="600">H</text>
<text x="709" y="313" font-size="19" style="fill:#172033" text-anchor="start" font-weight="400">H 被调度裁掉，尚未接受 target 检验</text>
<text x="32" y="380" font-size="20" style="fill:#172033" text-anchor="start" font-weight="650">验证示例</text>
<rect x="152" y="352" width="44" height="40" rx="6" fill="#E4F4EA" stroke="#2E8B57" stroke-width="1.5"/>
<text x="174.0" y="379" font-size="20" style="fill:#172033" text-anchor="middle" font-weight="600">E</text>
<rect x="206" y="352" width="44" height="40" rx="6" fill="#E4F4EA" stroke="#2E8B57" stroke-width="1.5"/>
<text x="228.0" y="379" font-size="20" style="fill:#172033" text-anchor="middle" font-weight="600">F</text>
<rect x="260" y="352" width="44" height="40" rx="6" fill="#FDE9E7" stroke="#C05252" stroke-width="1.5"/>
<text x="282.0" y="379" font-size="20" style="fill:#172033" text-anchor="middle" font-weight="600">G</text>
<path d="M322,373 L424,373" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="448" y="352" width="44" height="40" rx="6" fill="#E4F4EA" stroke="#2E8B57" stroke-width="1.5"/>
<text x="470.0" y="379" font-size="20" style="fill:#172033" text-anchor="middle" font-weight="600">E</text>
<rect x="502" y="352" width="44" height="40" rx="6" fill="#E4F4EA" stroke="#2E8B57" stroke-width="1.5"/>
<text x="524.0" y="379" font-size="20" style="fill:#172033" text-anchor="middle" font-weight="600">F</text>
<rect x="556" y="352" width="44" height="40" rx="6" fill="#FFF2D6" stroke="#B47815" stroke-width="1.5"/>
<text x="578.0" y="379" font-size="20" style="fill:#172033" text-anchor="middle" font-weight="600">G*</text>
<text x="644" y="380" font-size="19" style="fill:#172033" text-anchor="start" font-weight="400">G 被 target 拒绝，G* 成为下一轮 anchor</text>
<text x="32" y="449" font-size="19" style="fill:#637083" text-anchor="start" font-weight="400">SGLang 的总预算可来自历史 confidence；当前 confidence 再决定各请求的具体长度。</text>
<text x="32" y="485" font-size="19" style="fill:#637083" text-anchor="start" font-weight="400">少验证要落实为有效行布局；随机验证使用修正后的 q，并检查截断决策的因果依赖。</text>
</svg>
