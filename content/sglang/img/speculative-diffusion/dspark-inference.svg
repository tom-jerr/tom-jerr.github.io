<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="768" viewBox="0 0 1120 768" role="img" aria-labelledby="title desc">
<title id="title">SGLang DSpark：一轮 decode 的三个组件与滞后预算</title><desc id="desc">host 在 forward prepare 用滞后两槽的历史 confidence 选出预算 K；当前 decode 中 proposer 提出候选，planner 分配 K 并定布局，executor 验证、接受并提交；发布的结果进入下一轮的滞后读取。</desc>
<style>text{font-family:Inter, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif;fill:#172033}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="1120" height="768" fill="white"/>
<text x="32" y="39" font-size="26" style="fill:#172033" text-anchor="start" font-weight="700">SGLang DSpark：一轮 decode 的三个组件与滞后预算</text>
<text x="32" y="78" font-size="19" style="fill:#637083" text-anchor="start" font-weight="400">固定源码 822e73ccddc0 · 箭头表示数据依赖，框宽不代表耗时 · 默认 min_verify_len = 1</text>
<text x="32" y="119" font-size="20" style="fill:#172033" text-anchor="start" font-weight="650">Host / forward prepare（overlap 下先于本轮 GPU 执行）</text>
<path d="M272,193 L299,193" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M544,193 L571,193" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M816,193 L843,193" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="137" width="240" height="112" rx="10" fill="#F3F5F8" stroke="#CAD3E1" stroke-width="1.5"/>
<text x="152.0" y="169" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">滞后读取</text>
<text x="152.0" y="199" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">slot = (ring_pos − 2) % 3</text>
<text x="152.0" y="224" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">copy_done.query() 非阻塞</text>
<text x="152" y="244" font-size="16" style="fill:#637083" text-anchor="middle" font-weight="400">ConfidenceRelay.resolve()</text>
<rect x="304" y="137" width="240" height="112" rx="10" fill="#FFF2D6" stroke="#B47815" stroke-width="1.5"/>
<text x="424.0" y="169" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">历史置信度预算</text>
<text x="424.0" y="199" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">_shift_to_lag → cumprod</text>
<text x="424.0" y="224" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">generation 失效 → 全 1</text>
<text x="424" y="244" font-size="16" style="fill:#637083" text-anchor="middle" font-weight="400">compute_budget()</text>
<rect x="576" y="137" width="240" height="112" rx="10" fill="#FFF2D6" stroke="#B47815" stroke-width="1.5"/>
<text x="696.0" y="169" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">预算搜索</text>
<text x="696.0" y="199" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">展平过滤排序 → 前缀和</text>
<text x="696.0" y="224" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">argmax(τ̂ × SPS) → K</text>
<text x="696" y="244" font-size="16" style="fill:#637083" text-anchor="middle" font-weight="400">compute_verify_token_budget()</text>
<rect x="848" y="137" width="240" height="112" rx="10" fill="#F3F5F8" stroke="#CAD3E1" stroke-width="1.5"/>
<text x="968.0" y="169" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">预算预先写入</text>
<text x="968.0" y="199" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">draft_input</text>
<text x="968.0" y="224" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">verify_token_budget = K</text>
<text x="968" y="244" font-size="16" style="fill:#637083" text-anchor="middle" font-weight="400">overlap 下由 scheduler 调用</text>
<text x="32" y="330" font-size="20" style="fill:#172033" text-anchor="start" font-weight="650">Device / 当前 decode step（DSparkWorkerV2._forward_decode）</text>
<path d="M968,249 L968,290 L434,290 L434,345" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="610" y="282" font-size="17" style="fill:#172033" text-anchor="start" font-weight="400">预先写入的 K；本轮无 host↔device 同步</text>
<path d="M285,420 L302,420" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M560,420 L577,420" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M835,420 L852,420" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="345" width="253" height="150" rx="10" fill="#E2F5F1" stroke="#138A7E" stroke-width="1.5"/>
<text x="158.5" y="377" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">Proposer</text>
<text x="158.5" y="407" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">一次并行 backbone</text>
<text x="158.5" y="432" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">序列头修正 → 采样</text>
<text x="158" y="460" font-size="16" style="fill:#637083" text-anchor="middle" font-weight="400">propose()</text>
<rect x="307" y="345" width="253" height="150" rx="10" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5"/>
<text x="433.5" y="377" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">Planner</text>
<text x="433.5" y="407" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">取回预算 → top-K 分配</text>
<text x="433.5" y="432" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">verify_lens + TP 广播</text>
<text x="433" y="462" font-size="15" style="fill:#637083" text-anchor="middle" font-weight="400">resolve_verify_token_budget()</text>
<text x="433" y="478" font-size="15" style="fill:#637083" text-anchor="middle" font-weight="400">schedule_layout()</text>
<rect x="582" y="345" width="253" height="150" rx="10" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="1.5"/>
<text x="708.5" y="377" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">Executor · verify</text>
<text x="708.5" y="407" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">ragged 行压紧 → bucket</text>
<text x="708.5" y="432" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">grammar mask → eager</text>
<text x="708" y="460" font-size="15" style="fill:#637083" text-anchor="middle" font-weight="400">run_compact / run_non_compact</text>
<rect x="857" y="345" width="253" height="150" rx="10" fill="#E4F4EA" stroke="#2E8B57" stroke-width="1.5"/>
<text x="983.5" y="377" font-size="22" style="fill:#172033" text-anchor="middle" font-weight="650">接受与提交</text>
<text x="983.5" y="407" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">accept_and_finalize</text>
<text x="983.5" y="432" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">commit_hidden → KV 注入</text>
<text x="983.5" y="457" font-size="19" style="fill:#172033" text-anchor="middle" font-weight="400">on_publish → relay</text>
<path d="M158,495 L158,585 L983,585 L983,495" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="168" y="566" font-size="17" style="fill:#172033" text-anchor="start" font-weight="400">候选 token 与 corrected q → 接受判定，不参与分配</text>
<path d="M1108,420 L1108,92 L152,92 L152,137" fill="none" stroke="#172033" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="520" y="100" font-size="17" style="fill:#172033" text-anchor="start" font-weight="400">on_publish(confidence) → D2H ring 写入；下一轮 prepare 滞后读取</text>
<text x="32" y="615" font-size="21" style="fill:#172033" text-anchor="start" font-weight="650">示例：R = 2，host 从历史分数选出 K = 4</text>
<text x="32" y="647" font-size="20" style="fill:#172033" text-anchor="start" font-weight="400">当前 survival 分配 [3,1] → verify_lens = [4,2]（各含 1 个 anchor）</text>
<text x="32" y="679" font-size="20" style="fill:#172033" text-anchor="start" font-weight="400">target 有效行 M = R + K = 6；capture bucket 可能 replay 8 行</text>
<text x="32" y="720" font-size="19" style="fill:#637083" text-anchor="start" font-weight="400">预算决定额度，当前块决定归属；两者在 schedule_layout() 汇合。发布的是本轮置信度，读回的是滞后两槽的历史。</text>
<text x="32" y="752" font-size="19" style="fill:#637083" text-anchor="start" font-weight="400">TP：draft 采样与 verify_lens 分别经 DSPARK_DRAFT_* / DSPARK_PLAN 从 rank 0 广播；预算本身无 collective。</text>
</svg>
