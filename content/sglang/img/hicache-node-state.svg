<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">HiCache node state transitions</title>
<desc id="desc">A node transitions among miss, GPU-only, GPU plus host backup, host-only tombstone and removed states.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#172033"/></marker>
<marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#637083"/></marker>
<marker id="arrow-gpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E45756"/></marker>
<marker id="arrow-cpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6FE4"/></marker>
<marker id="arrow-store" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#138A7E"/></marker>
<marker id="arrow-control" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7656D8"/></marker>
<marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2E8B57"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#172033" flood-opacity="0.09"/></filter>
</defs>
<rect width="1200" height="680" fill="#F8FAFD"/>
<text x="64" y="46" fill="#7656D8" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" text-anchor="start">STATE</text>
<text x="64" y="83" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="750" text-anchor="start">一个 TreeNode 的分层状态</text>
<text x="64" y="114" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="450" text-anchor="start">树结构保留 Prefix；value / host_value 决定驻留层级</text>
<rect x="64" y="230" width="180" height="100" rx="18" fill="#EEF2F7" stroke="#637083" stroke-width="2" opacity="1.0" filter="url(#shadow)"/>
<text x="154" y="273" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">MISS</text>
<text x="154" y="304" fill="#637083" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="16" font-weight="500" text-anchor="middle">无数据</text>
<rect x="310" y="230" width="220" height="100" rx="18" fill="#FDE9E7" stroke="#E45756" stroke-width="2" opacity="1.0" filter="url(#shadow)"/>
<text x="420" y="273" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">GPU only</text>
<text x="420" y="304" fill="#637083" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="16" font-weight="500" text-anchor="middle">value</text>
<rect x="596" y="230" width="236" height="100" rx="18" fill="#F1ECFF" stroke="#7656D8" stroke-width="2" opacity="1.0" filter="url(#shadow)"/>
<text x="714" y="273" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">GPU + L2</text>
<text x="714" y="304" fill="#637083" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="16" font-weight="500" text-anchor="middle">value + host</text>
<rect x="898" y="230" width="238" height="100" rx="18" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="2" opacity="1.0" filter="url(#shadow)"/>
<text x="1017" y="273" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">L2 only</text>
<text x="1017" y="304" fill="#637083" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="16" font-weight="500" text-anchor="middle">tombstone</text>
<line x1="244" y1="280" x2="310" y2="280" stroke="#637083" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
<text x="277" y="257" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle">insert</text>
<line x1="530" y1="280" x2="596" y2="280" stroke="#637083" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
<text x="563" y="257" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle">backup</text>
<line x1="832" y1="280" x2="898" y2="280" stroke="#637083" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
<text x="865" y="257" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle">evict L1</text>
<path d="M 1017 330 C 1017 410, 714 410, 714 330" fill="none" stroke="#2F6FE4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cpu)"/>
<text x="866" y="440" fill="#2F6FE4" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="650" text-anchor="middle">load back</text>
<rect x="465" y="492" width="270" height="92" rx="16" fill="#FFFFFF" stroke="#CAD3E1" stroke-width="2" opacity="1.0" stroke-dasharray="8 7"/>
<text x="600" y="530" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="700" text-anchor="middle">REMOVED</text>
<text x="600" y="559" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="middle">L2 evict</text>
<path d="M 1017 330 C 1017 520, 790 538, 735 538" fill="none" stroke="#637083" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<path d="M 420 330 C 420 460, 465 500, 505 513" fill="none" stroke="#637083" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-muted)"/>
<rect x="64" y="594" width="230" height="36" rx="18" fill="#FFF2D6" stroke="#FFF2D6" stroke-width="0" opacity="1.0"/>
<text x="179" y="619" fill="#C47B10" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" text-anchor="middle">父先备份，子才能备份</text>
<rect x="906" y="594" width="230" height="36" rx="18" fill="#EEF2F7" stroke="#EEF2F7" stroke-width="0" opacity="1.0"/>
<text x="1021" y="619" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" text-anchor="middle">从最深叶子开始驱逐</text>
</svg>
