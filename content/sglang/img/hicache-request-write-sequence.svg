<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1407" viewBox="0 0 1520 1407" role="img" aria-labelledby="title desc">
<title id="title">写穿时序：L1 登记、D2H 完成、L3 backup、释放保护</title>
<desc id="desc">时间向下；实线为调用或提交，虚线为完成通知；不是等比例耗时。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#172033"/></marker>
<marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#637083"/></marker>
<marker id="arrow-gpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E45756"/></marker>
<marker id="arrow-cpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6FE4"/></marker>
<marker id="arrow-store" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#138A7E"/></marker>
<marker id="arrow-control" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7656D8"/></marker>
<marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2E8B57"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#172033" flood-opacity="0.09"/></filter>
</defs>
<rect width="1520" height="1407" fill="#F8FAFD"/>
<text x="42" y="42" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="700" text-anchor="start">写穿时序：L1 登记、D2H 完成、L3 backup、释放保护</text>
<text x="42" y="74" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" text-anchor="start">时间向下 ↓    实线：调用 / 提交    虚线：完成通知    同一泳道：本线程操作</text>
<line x1="170.0" y1="148" x2="170.0" y2="1335" stroke="#CAD3E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 7"/>
<rect x="35.0" y="102" width="270" height="48" rx="8" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5" opacity="1.0"/>
<text x="170.0" y="132.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="170.0" dy="0">Scheduler</tspan></text>
<line x1="563.3333333333333" y1="148" x2="563.3333333333333" y2="1335" stroke="#CAD3E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 7"/>
<rect x="428.33333333333326" y="102" width="270" height="48" rx="8" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5" opacity="1.0"/>
<text x="563.3333333333333" y="132.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="563.3333333333333" dy="0">HiRadix / Controller</tspan></text>
<line x1="956.6666666666666" y1="148" x2="956.6666666666666" y2="1335" stroke="#CAD3E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 7"/>
<rect x="821.6666666666666" y="102" width="270" height="48" rx="8" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5" opacity="1.0"/>
<text x="956.6666666666666" y="132.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="956.6666666666666" dy="0">D2H stream</tspan></text>
<line x1="1350.0" y1="148" x2="1350.0" y2="1335" stroke="#CAD3E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 7"/>
<rect x="1215.0" y="102" width="270" height="48" rx="8" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5" opacity="1.0"/>
<text x="1350.0" y="132.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="1350.0" dy="0">Backup 线程 / L3</tspan></text>
<text x="42" y="207" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">01</text>
<line x1="170.0" y1="228" x2="563.3333333333333" y2="228" stroke="#7656D8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-control)"/>
<text x="366.66666666666663" y="191" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="366.66666666666663" dy="0">Prefill 后 cache_unfinished_req</tspan><tspan x="366.66666666666663" dy="22">或结束后 cache_finished_req</tspan></text>
<text x="42" y="290" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">02</text>
<rect x="426.33333333333326" y="259" width="274" height="62" rx="8" fill="#FFFFFF" stroke="#7656D8" stroke-width="1.5" opacity="1.0"/>
<text x="563.3333333333333" y="282.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="563.3333333333333" dy="0">insert：登记 GPU indices</tspan><tspan x="563.3333333333333" dy="24">去重 / 页对齐 / 写策略判断</tspan></text>
<text x="42" y="373" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">03</text>
<line x1="563.3333333333333" y1="394" x2="956.6666666666666" y2="394" stroke="#2F6FE4" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-cpu)"/>
<text x="760.0" y="357" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="760.0" dy="0">write_backup → write()</tspan><tspan x="760.0" dy="22">分配 L2，提交 D2H</tspan></text>
<text x="42" y="456" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">04</text>
<rect x="426.33333333333326" y="425" width="274" height="62" rx="8" fill="#FFFFFF" stroke="#2F6FE4" stroke-width="1.5" opacity="1.0"/>
<text x="563.3333333333333" y="448.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="563.3333333333333" dy="0">host_value 已分配 + pending</tspan><tspan x="563.3333333333333" dy="24">保留 GPU 源数据保护</tspan></text>
<text x="42" y="539" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">05</text>
<rect x="33.0" y="508" width="274" height="62" rx="8" fill="#FFFFFF" stroke="#7656D8" stroke-width="1.5" opacity="1.0"/>
<text x="170.0" y="531.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="170.0" dy="0">请求继续 Decode，或结束清理</tspan><tspan x="170.0" dy="24">无需等待 L3 backup</tspan></text>
<text x="42" y="622" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">06</text>
<line x1="956.6666666666666" y1="643" x2="563.3333333333333" y2="643" stroke="#637083" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow-muted)"/>
<text x="760.0" y="606" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="760.0" dy="0">ack_write.finish_event 就绪</tspan><tspan x="760.0" dy="22">确认所有层 D2H 完成</tspan></text>
<text x="42" y="705" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">07</text>
<line x1="170.0" y1="726" x2="563.3333333333333" y2="726" stroke="#7656D8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-control)"/>
<text x="366.66666666666663" y="689" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="366.66666666666663" dy="0">writing_check()</tspan><tspan x="366.66666666666663" dy="22">消费 D2H ACK</tspan></text>
<text x="42" y="788" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">08</text>
<rect x="426.33333333333326" y="757" width="274" height="62" rx="8" fill="#FFFFFF" stroke="#2F6FE4" stroke-width="1.5" opacity="1.0"/>
<text x="563.3333333333333" y="780.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="563.3333333333333" dy="0">_finish_write_through_ack</tspan><tspan x="563.3333333333333" dy="24">清 pending / 发布 CPU 完成</tspan></text>
<text x="42" y="871" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">09</text>
<line x1="563.3333333333333" y1="892" x2="1350.0" y2="892" stroke="#138A7E" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-store)"/>
<text x="956.6666666666666" y="855" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="956.6666666666666" dy="0">write_backup_storage</tspan><tspan x="956.6666666666666" dy="22">backup_queue；保护 Host 源页</tspan></text>
<text x="42" y="954" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">10</text>
<rect x="426.33333333333326" y="923" width="274" height="62" rx="8" fill="#FFFFFF" stroke="#7656D8" stroke-width="1.5" opacity="1.0"/>
<text x="563.3333333333333" y="946.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="563.3333333333333" dy="0">释放 D2H 的 GPU 保护锁</tspan><tspan x="563.3333333333333" dy="24">L3 读取源已在 Host</tspan></text>
<text x="42" y="1037" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">11</text>
<rect x="1213.0" y="1006" width="274" height="62" rx="8" fill="#FFFFFF" stroke="#138A7E" stroke-width="1.5" opacity="1.0"/>
<text x="1350.0" y="1029.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="1350.0" dy="0">逐批 page_set_func</tspan><tspan x="1350.0" dy="24">成功批次累计 completed_tokens</tspan></text>
<text x="42" y="1120" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">12</text>
<line x1="1350.0" y1="1141" x2="563.3333333333333" y2="1141" stroke="#637083" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow-muted)"/>
<text x="956.6666666666666" y="1104" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="956.6666666666666" dy="0">ack_backup_queue</tspan><tspan x="956.6666666666666" dy="22">操作结束，可含部分写入失败</tspan></text>
<text x="42" y="1203" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">13</text>
<line x1="170.0" y1="1224" x2="563.3333333333333" y2="1224" stroke="#7656D8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-control)"/>
<text x="366.66666666666663" y="1187" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="366.66666666666663" dy="0">Scheduler drain backup ACK</tspan><tspan x="366.66666666666663" dy="22">移除 ongoing_backup</tspan></text>
<text x="42" y="1286" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">14</text>
<rect x="426.33333333333326" y="1255" width="274" height="62" rx="8" fill="#FFFFFF" stroke="#2F6FE4" stroke-width="1.5" opacity="1.0"/>
<text x="563.3333333333333" y="1278.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="563.3333333333333" dy="0">release_host()</tspan><tspan x="563.3333333333333" dy="24">允许驱逐，通常不立即释放页</tspan></text>
<text x="42" y="1382" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" text-anchor="start">写穿主路径；选择性写穿多一道计数阈值。write_back 的 GPU 释放顺序见下一图。</text>
</svg>
