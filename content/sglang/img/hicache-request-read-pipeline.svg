<text x="30" y="583" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="600" text-anchor="start">GPU compute</text>
<line x1="210" y1="617" x2="1640" y2="617" stroke="#CAD3E1" stroke-width="1" stroke-linecap="round"/>
