<path d="M 1640 476 L 1516 476 L 1516 576 L 1530 576" fill="none" stroke="#172033" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="220" y="145" width="190" height="62" rx="8" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5" opacity="1.0"/>
<text x="315.0" y="168.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="315.0" dy="0">本地 L1 / L2 match</tspan><tspan x="315.0" dy="24">提交 L3 suffix</tspan></text>
<rect x="440" y="245" width="175" height="62" rx="8" fill="#E2F5F1" stroke="#138A7E" stroke-width="1.5" opacity="1.0"/>
<text x="527.5" y="268.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="527.5" dy="0">hash + exists</tspan><tspan x="527.5" dy="24">跨 Rank MIN</tspan></text>
<rect x="650" y="145" width="170" height="62" rx="8" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="1.5" opacity="1.0"/>
<text x="735.0" y="168.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="735.0" dy="0">drain hit 结果</tspan><tspan x="735.0" dy="24">按命中分配 L2</tspan></text>
<rect x="850" y="345" width="180" height="62" rx="8" fill="#E2F5F1" stroke="#138A7E" stroke-width="1.5" opacity="1.0"/>
<text x="940.0" y="368.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="940.0" dy="0">batch_get → Host</tspan><tspan x="940.0" dy="24">ACK / 跨 Rank MIN</tspan></text>
<rect x="1060" y="145" width="170" height="62" rx="8" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5" opacity="1.0"/>
<text x="1145.0" y="168.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="1145.0" dy="0">发布 L2 + 重匹配</tspan><tspan x="1145.0" dy="24">预算检查</tspan></text>
<rect x="1260" y="145" width="175" height="62" rx="8" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="1.5" opacity="1.0"/>
<text x="1347.5" y="168.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="1347.5" dy="0">init_load_back</tspan><tspan x="1347.5" dy="24">申请 L1 / load_queue</tspan></text>
<rect x="1460" y="445" width="180" height="62" rx="8" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="1.5" opacity="1.0"/>
<text x="1550.0" y="468.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="1550.0" dy="0">start_loading</tspan><tspan x="1550.0" dy="24">按层恢复 prefix</tspan></text>
<rect x="1530" y="545" width="110" height="62" rx="8" fill="#FDE9E7" stroke="#E45756" stroke-width="1.5" opacity="1.0"/>
<text x="1585.0" y="568.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="1585.0" dy="0">Prefill</tspan><tspan x="1585.0" dy="24">真 miss</tspan></text>
<rect x="440" y="545" width="930" height="62" rx="8" fill="#FDE9E7" stroke="#E45756" stroke-width="1.5" opacity="1.0"/>
<text x="905.0" y="582.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="905.0" dy="0">已有请求继续 Prefill / Decode；不依赖本请求的 L3 prefetch 完成</tspan></text>
<text x="1456" y="534" fill="#2F6FE4" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">逐层 event →</text>
<line x1="210" y1="632" x2="1640" y2="632" stroke="#172033" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1540" y="620" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">时间 →</text>
</svg>
