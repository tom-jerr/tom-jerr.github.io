<svg xmlns="http://www.w3.org/2000/svg" width="1690" height="655" viewBox="0 0 1690 655" role="img" aria-labelledby="title desc">
<title id="title">从入队到 Prefill 的读 pipeline</title>
<desc id="desc">时间向右；预取期间其他请求可运行；当前请求先发布 L2 再申请 H2D。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#172033"/></marker>
<marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#637083"/></marker>
<marker id="arrow-gpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E45756"/></marker>
<marker id="arrow-cpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6FE4"/></marker>
<marker id="arrow-store" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#138A7E"/></marker>
<marker id="arrow-control" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7656D8"/></marker>
<marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2E8B57"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#172033" flood-opacity="0.09"/></filter>
</defs>
<rect width="1690" height="655" fill="#F8FAFD"/>
<text x="38" y="43" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="700" text-anchor="start">读 pipeline：先扩展可复用前缀，再启动本请求的 Prefill</text>
<text x="38" y="76" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" text-anchor="start">顺序示意，不按耗时比例；成功且达到预取 / 回填阈值的 cache-mode 路径</text>
<text x="30" y="183" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="600" text-anchor="start">Scheduler</text>
<line x1="210" y1="217" x2="1640" y2="217" stroke="#CAD3E1" stroke-width="1" stroke-linecap="round"/>
<text x="30" y="283" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="600" text-anchor="start">L3 Query</text>
<line x1="210" y1="317" x2="1640" y2="317" stroke="#CAD3E1" stroke-width="1" stroke-linecap="round"/>
<text x="30" y="383" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="600" text-anchor="start">L3 I/O → L2</text>
<line x1="210" y1="417" x2="1640" y2="417" stroke="#CAD3E1" stroke-width="1" stroke-linecap="round"/>
<text x="30" y="483" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="600" text-anchor="start">H2D stream</text>
