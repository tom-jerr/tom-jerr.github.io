<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="590" viewBox="0 0 1700 590" role="img" aria-labelledby="title desc">
<title id="title">Layer-wise H2D and forward overlap</title>
<desc id="desc">Each layer&#x27;s forward waits only for that layer&#x27;s restored prefix KV.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#172033"/></marker>
<marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#637083"/></marker>
<marker id="arrow-gpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E45756"/></marker>
<marker id="arrow-cpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6FE4"/></marker>
<marker id="arrow-store" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#138A7E"/></marker>
<marker id="arrow-control" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7656D8"/></marker>
<marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2E8B57"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#172033" flood-opacity="0.09"/></filter>
</defs>
<rect width="1700" height="590" fill="#F8FAFD"/>
<text x="64" y="46" fill="#7656D8" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" text-anchor="start">L2 LOAD</text>
<text x="64" y="83" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="750" text-anchor="start">H2D 与 Forward 是逐层生产—消费</text>
<text x="64" y="114" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="450" text-anchor="start">逐层 event 是模型读取门槛；整次 ACK 只负责生命周期清理</text>
<text x="42" y="199" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="650" text-anchor="start">H2D stream</text>
<line x1="220" y1="207" x2="1650" y2="207" stroke="#CAD3E1" stroke-width="1" stroke-linecap="round"/>
<text x="42" y="349" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="650" text-anchor="start">Compute stream</text>
<line x1="220" y1="357" x2="1650" y2="357" stroke="#CAD3E1" stroke-width="1" stroke-linecap="round"/>
<text x="42" y="499" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="650" text-anchor="start">Scheduler</text>
<line x1="220" y1="507" x2="1650" y2="507" stroke="#CAD3E1" stroke-width="1" stroke-linecap="round"/>
<rect x="250" y="165" width="225" height="72" rx="12" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="2" opacity="1.0"/>
<text x="362" y="207" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" text-anchor="middle"><tspan x="362" dy="0">Layer 0 · H2D</tspan></text>
<rect x="555" y="315" width="225" height="72" rx="12" fill="#FDE9E7" stroke="#E45756" stroke-width="2" opacity="1.0"/>
<text x="667" y="357" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" text-anchor="middle"><tspan x="667" dy="0">Layer 0 · Forward</tspan></text>
<path d="M 475 201 L 537 201 L 537 351 L 555 351" fill="none" stroke="#2F6FE4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cpu)"/>
<text x="547" y="292" fill="#2F6FE4" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" font-weight="650" text-anchor="end">event 0</text>
<rect x="555" y="165" width="225" height="72" rx="12" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="2" opacity="1.0"/>
<text x="667" y="207" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" text-anchor="middle"><tspan x="667" dy="0">Layer 1 · H2D</tspan></text>
<rect x="860" y="315" width="225" height="72" rx="12" fill="#FDE9E7" stroke="#E45756" stroke-width="2" opacity="1.0"/>
<text x="972" y="357" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" text-anchor="middle"><tspan x="972" dy="0">Layer 1 · Forward</tspan></text>
<path d="M 780 201 L 842 201 L 842 351 L 860 351" fill="none" stroke="#2F6FE4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cpu)"/>
<text x="852" y="292" fill="#2F6FE4" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" font-weight="650" text-anchor="end">event 1</text>
<rect x="860" y="165" width="225" height="72" rx="12" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="2" opacity="1.0"/>
<text x="972" y="207" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" text-anchor="middle"><tspan x="972" dy="0">Layer 2 · H2D</tspan></text>
<rect x="1165" y="315" width="225" height="72" rx="12" fill="#FDE9E7" stroke="#E45756" stroke-width="2" opacity="1.0"/>
<text x="1277" y="357" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" text-anchor="middle"><tspan x="1277" dy="0">Layer 2 · Forward</tspan></text>
<path d="M 1085 201 L 1147 201 L 1147 351 L 1165 351" fill="none" stroke="#2F6FE4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cpu)"/>
<text x="1157" y="292" fill="#2F6FE4" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" font-weight="650" text-anchor="end">event 2</text>
<rect x="1165" y="165" width="225" height="72" rx="12" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="2" opacity="1.0"/>
<text x="1277" y="207" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" text-anchor="middle"><tspan x="1277" dy="0">Layer 3 · H2D</tspan></text>
<rect x="1470" y="315" width="225" height="72" rx="12" fill="#FDE9E7" stroke="#E45756" stroke-width="2" opacity="1.0"/>
<text x="1582" y="357" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" text-anchor="middle"><tspan x="1582" dy="0">Layer 3 · Forward</tspan></text>
<path d="M 1390 201 L 1452 201 L 1452 351 L 1470 351" fill="none" stroke="#2F6FE4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cpu)"/>
<text x="1462" y="292" fill="#2F6FE4" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" font-weight="650" text-anchor="end">event 3</text>
<rect x="920" y="455" width="520" height="75" rx="12" fill="#FFFFFF" stroke="#7656D8" stroke-width="2" opacity="1.0"/>
<text x="1180" y="498" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" text-anchor="middle"><tspan x="1180" dy="0">loading_check：整次 H2D ACK 后清理 ongoing_load_back</tspan></text>
<path d="M 1390 201 L 1580 201 L 1580 493 L 1440 493" fill="none" stroke="#637083" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-muted)"/>
</svg>
