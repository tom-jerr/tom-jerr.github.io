<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">HiCache host memory layout</title>
<desc id="desc">GPU KV remains layer-first while host and storage use page-first layout for contiguous page transfer.</desc>
