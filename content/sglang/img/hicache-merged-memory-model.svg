<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="690" viewBox="0 0 1700 690" role="img" aria-labelledby="title desc">
<title id="title">HiCache residency and memory layout</title>
<desc id="desc">Radix metadata maps a shared prefix to GPU, host and hashed storage residency.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#172033"/></marker>
<marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#637083"/></marker>
<marker id="arrow-gpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E45756"/></marker>
<marker id="arrow-cpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6FE4"/></marker>
<marker id="arrow-store" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#138A7E"/></marker>
<marker id="arrow-control" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7656D8"/></marker>
<marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2E8B57"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#172033" flood-opacity="0.09"/></filter>
</defs>
<rect width="1700" height="690" fill="#F8FAFD"/>
<text x="64" y="46" fill="#7656D8" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" text-anchor="start">RESIDENCY MODEL</text>
<text x="64" y="83" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="750" text-anchor="start">逻辑命中与物理可读是两回事</text>
<text x="64" y="114" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="450" text-anchor="start">L1/L2 共享 Radix 节点；L3 通过链式 page hash 查询</text>
<rect x="70" y="165" width="430" height="250" rx="18" fill="#FDE9E7" stroke="#E45756" stroke-width="2" opacity="1.0" filter="url(#shadow)"/>
<text x="96" y="207" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="750" text-anchor="start">L1 · GPU</text>
<text x="96" y="262" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="550" text-anchor="start"><tspan x="96" dy="0">Layer-first</tspan><tspan x="96" dy="40">node.value</tspan><tspan x="96" dy="40">可直接供 Attention 读取</tspan></text>
<rect x="585" y="165" width="430" height="250" rx="18" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="2" opacity="1.0" filter="url(#shadow)"/>
<text x="611" y="207" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="750" text-anchor="start">L2 · Host</text>
<text x="611" y="262" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="550" text-anchor="start"><tspan x="611" dy="0">Page-first</tspan><tspan x="611" dy="40">node.host_value</tspan><tspan x="611" dy="40">必须先完成 H2D</tspan></text>
<rect x="1100" y="165" width="430" height="250" rx="18" fill="#E2F5F1" stroke="#138A7E" stroke-width="2" opacity="1.0" filter="url(#shadow)"/>
<text x="1126" y="207" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="750" text-anchor="start">L3 · Storage</text>
<text x="1126" y="262" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="550" text-anchor="start"><tspan x="1126" dy="0">page hash → object</tspan><tspan x="1126" dy="40">backend owns placement</tspan><tspan x="1126" dy="40">先 L3→L2→L1</tspan></text>
<line x1="500" y1="270" x2="585" y2="270" stroke="#E45756" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gpu)"/>
<line x1="585" y1="310" x2="500" y2="310" stroke="#2F6FE4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-cpu)"/>
<line x1="1015" y1="270" x2="1100" y2="270" stroke="#138A7E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-store)"/>
<line x1="1100" y1="310" x2="1015" y2="310" stroke="#138A7E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-store)"/>
<rect x="494" y="230" width="98" height="32" rx="16" fill="#FDE9E7" stroke="#E45756" stroke-width="1" opacity="1.0"/>
<text x="543" y="252" fill="#E45756" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">D2H</text>
<rect x="494" y="330" width="98" height="32" rx="16" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="1" opacity="1.0"/>
<text x="543" y="352" fill="#2F6FE4" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">H2D</text>
<rect x="1006" y="230" width="98" height="32" rx="16" fill="#E2F5F1" stroke="#138A7E" stroke-width="1" opacity="1.0"/>
<text x="1055" y="252" fill="#138A7E" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">SET</text>
<rect x="1006" y="330" width="98" height="32" rx="16" fill="#E2F5F1" stroke="#138A7E" stroke-width="1" opacity="1.0"/>
<text x="1055" y="352" fill="#138A7E" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">GET</text>
<rect x="70" y="480" width="1460" height="145" rx="16" fill="#FFFFFF" stroke="#CAD3E1" stroke-width="2" opacity="1.0"/>
<text x="98" y="520" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="750" text-anchor="start">三个完成点</text>
<line x1="280" y1="565" x2="1320" y2="565" stroke="#CAD3E1" stroke-width="3" stroke-linecap="round"/>
<circle cx="315" cy="565" r="10" fill="#138A7E" stroke="#FFFFFF" stroke-width="3"/>
<text x="315" y="550" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" text-anchor="middle">L3 exists hit</text>
<text x="315" y="597" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="550" text-anchor="middle">只有 metadata</text>
<circle cx="780" cy="565" r="10" fill="#2F6FE4" stroke="#FFFFFF" stroke-width="3"/>
<text x="780" y="550" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" text-anchor="middle">L3→L2 finish + publish</text>
<text x="780" y="597" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="550" text-anchor="middle">Host bytes 有效</text>
<circle cx="1260" cy="565" r="10" fill="#E45756" stroke="#FFFFFF" stroke-width="3"/>
<text x="1260" y="550" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" text-anchor="middle">layer i H2D event</text>
<text x="1260" y="597" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="550" text-anchor="middle">该层才可读取</text>
</svg>
