<svg xmlns="http://www.w3.org/2000/svg" width="1610" height="590" viewBox="0 0 1610 590" role="img" aria-labelledby="title desc">
<title id="title">写策略决定备份何时进入 pipeline</title>
<desc id="desc">写穿由插入和计数触发；写回由驱逐触发，释放 GPU 之前必须确认 D2H 完成。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#172033"/></marker>
<marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#637083"/></marker>
<marker id="arrow-gpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E45756"/></marker>
<marker id="arrow-cpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6FE4"/></marker>
<marker id="arrow-store" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#138A7E"/></marker>
<marker id="arrow-control" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7656D8"/></marker>
<marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2E8B57"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#172033" flood-opacity="0.09"/></filter>
</defs>
<rect width="1610" height="590" fill="#F8FAFD"/>
<text x="38" y="44" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="700" text-anchor="start">三种写策略：触发点不同，D2H → L3 的数据依赖相同</text>
<text x="38" y="80" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" text-anchor="start">普通 cache-mode / dense HiRadixCache；L3 已启用且 backup 未跳过</text>
<text x="28" y="180" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="650" text-anchor="start">write_through</text>
<line x1="440" y1="176" x2="480" y2="176" stroke="#172033" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="705" y1="176" x2="745" y2="176" stroke="#172033" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="970" y1="176" x2="1010" y2="176" stroke="#172033" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1235" y1="176" x2="1275" y2="176" stroke="#172033" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="215" y="145" width="225" height="62" rx="8" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5" opacity="1.0"/>
<text x="327.5" y="168.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="327.5" dy="0">insert</tspan><tspan x="327.5" dy="24">计数 ≥ 1</tspan></text>
<rect x="480" y="145" width="225" height="62" rx="8" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="1.5" opacity="1.0"/>
<text x="592.5" y="168.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="592.5" dy="0">申请 L2</tspan><tspan x="592.5" dy="24">D2H 所有层</tspan></text>
<rect x="745" y="145" width="225" height="62" rx="8" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="1.5" opacity="1.0"/>
<text x="857.5" y="168.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="857.5" dy="0">D2H finish</tspan><tspan x="857.5" dy="24">确认 Host 有效</tspan></text>
<rect x="1010" y="145" width="225" height="62" rx="8" fill="#E2F5F1" stroke="#138A7E" stroke-width="1.5" opacity="1.0"/>
<text x="1122.5" y="168.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="1122.5" dy="0">L2 → L3</tspan><tspan x="1122.5" dy="24">batch_set</tspan></text>
<rect x="1275" y="145" width="225" height="62" rx="8" fill="#E2F5F1" stroke="#138A7E" stroke-width="1.5" opacity="1.0"/>
<text x="1387.5" y="168.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="1387.5" dy="0">Storage ACK</tspan><tspan x="1387.5" dy="24">释放 Host 保护</tspan></text>
<text x="215" y="237" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">chunked=True 跳过计数；父节点 Host 前缀检查通过后才提交</text>
<text x="28" y="310" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="650" text-anchor="start">selective</text>
<line x1="440" y1="306" x2="480" y2="306" stroke="#172033" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="705" y1="306" x2="745" y2="306" stroke="#172033" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="970" y1="306" x2="1010" y2="306" stroke="#172033" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1235" y1="306" x2="1275" y2="306" stroke="#172033" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="215" y="275" width="225" height="62" rx="8" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5" opacity="1.0"/>
<text x="327.5" y="298.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="327.5" dy="0">insert / 再插入</tspan><tspan x="327.5" dy="24">计数 ≥ 2</tspan></text>
<rect x="480" y="275" width="225" height="62" rx="8" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="1.5" opacity="1.0"/>
<text x="592.5" y="298.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="592.5" dy="0">申请 L2</tspan><tspan x="592.5" dy="24">D2H 所有层</tspan></text>
<rect x="745" y="275" width="225" height="62" rx="8" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="1.5" opacity="1.0"/>
<text x="857.5" y="298.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="857.5" dy="0">D2H finish</tspan><tspan x="857.5" dy="24">确认 Host 有效</tspan></text>
<rect x="1010" y="275" width="225" height="62" rx="8" fill="#E2F5F1" stroke="#138A7E" stroke-width="1.5" opacity="1.0"/>
<text x="1122.5" y="298.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="1122.5" dy="0">L2 → L3</tspan><tspan x="1122.5" dy="24">batch_set</tspan></text>
<rect x="1275" y="275" width="225" height="62" rx="8" fill="#E2F5F1" stroke="#138A7E" stroke-width="1.5" opacity="1.0"/>
<text x="1387.5" y="298.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="1387.5" dy="0">Storage ACK</tspan><tspan x="1387.5" dy="24">释放 Host 保护</tspan></text>
<text x="215" y="367" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">chunked=True 跳过计数；父节点 Host 前缀检查通过后才提交</text>
<text x="28" y="440" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="650" text-anchor="start">write_back</text>
<line x1="440" y1="436" x2="480" y2="436" stroke="#172033" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="705" y1="436" x2="745" y2="436" stroke="#172033" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="970" y1="436" x2="1010" y2="436" stroke="#172033" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1235" y1="436" x2="1275" y2="436" stroke="#172033" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="215" y="405" width="225" height="62" rx="8" fill="#EEE9FF" stroke="#7656D8" stroke-width="1.5" opacity="1.0"/>
<text x="327.5" y="428.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="327.5" dy="0">GPU eviction</tspan><tspan x="327.5" dy="24">选中无 Host 副本节点</tspan></text>
<rect x="480" y="405" width="225" height="62" rx="8" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="1.5" opacity="1.0"/>
<text x="592.5" y="428.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="592.5" dy="0">申请 L2</tspan><tspan x="592.5" dy="24">D2H 所有层</tspan></text>
<rect x="745" y="405" width="225" height="62" rx="8" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="1.5" opacity="1.0"/>
<text x="857.5" y="428.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="857.5" dy="0">D2H finish</tspan><tspan x="857.5" dy="24">确认 Host 有效</tspan></text>
<rect x="1010" y="405" width="225" height="62" rx="8" fill="#E2F5F1" stroke="#138A7E" stroke-width="1.5" opacity="1.0"/>
<text x="1122.5" y="428.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="1122.5" dy="0">L2 → L3</tspan><tspan x="1122.5" dy="24">batch_set</tspan></text>
<rect x="1275" y="405" width="225" height="62" rx="8" fill="#E2F5F1" stroke="#138A7E" stroke-width="1.5" opacity="1.0"/>
<text x="1387.5" y="428.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="1387.5" dy="0">Storage ACK</tspan><tspan x="1387.5" dy="24">释放 Host 保护</tspan></text>
<line x1="857" y1="467" x2="857" y2="490" stroke="#2F6FE4" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-cpu)"/>
<text x="690" y="516" fill="#2F6FE4" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" text-anchor="start">到这里才 free 源 GPU slots；L3 不必完成</text>
<text x="38" y="566" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" text-anchor="start">写穿：D2H ACK 后 GPU 变得可驱逐。写回：可先清 node.value，但物理 GPU slots 要保留到 D2H 完成。</text>
</svg>
