<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">HiCache three-tier architecture</title>
<desc id="desc">HiRadixTree tracks prefix metadata while KV data moves among GPU, host memory and storage.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#172033"/></marker>
<marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#637083"/></marker>
<marker id="arrow-gpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E45756"/></marker>
<marker id="arrow-cpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6FE4"/></marker>
<marker id="arrow-store" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#138A7E"/></marker>
<marker id="arrow-control" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7656D8"/></marker>
<marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2E8B57"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#172033" flood-opacity="0.09"/></filter>
</defs>
<rect width="1200" height="660" fill="#F8FAFD"/>
<text x="64" y="46" fill="#7656D8" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" text-anchor="start">ARCHITECTURE</text>
<text x="64" y="83" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="750" text-anchor="start">一棵前缀树，三级 KV 数据</text>
<text x="64" y="114" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="450" text-anchor="start">树回答“在哪里”；数据层回答“怎么搬”</text>
<rect x="64" y="155" width="300" height="430" rx="18" fill="#EEE9FF" stroke="#7656D8" stroke-width="2" opacity="1.0" filter="url(#shadow)"/>
<rect x="92" y="184" width="122" height="36" rx="18" fill="#EEE9FF" stroke="#EEE9FF" stroke-width="0" opacity="1.0"/>
<text x="153" y="209" fill="#7656D8" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" text-anchor="middle">控制面</text>
<text x="92" y="252" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="750" text-anchor="start">HiRadixTree</text>
<text x="92" y="305" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="22" font-weight="600" text-anchor="start"><tspan x="92" dy="0">Prefix</tspan><tspan x="92" dy="54">State</tspan><tspan x="92" dy="54">Index / Hash</tspan></text>
<line x1="250" y1="300" x2="250" y2="430" stroke="#7656D8" stroke-width="3" stroke-linecap="round"/>
<circle cx="250" cy="300" r="9" fill="#E45756" stroke="#E45756" stroke-width="0"/>
<circle cx="250" cy="365" r="9" fill="#2F6FE4" stroke="#2F6FE4" stroke-width="0"/>
<circle cx="250" cy="430" r="9" fill="#138A7E" stroke="#138A7E" stroke-width="0"/>
<text x="92" y="530" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="500" text-anchor="start">不复制 KV</text>
<text x="92" y="557" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="500" text-anchor="start">只维护位置与状态</text>
<rect x="452" y="156" width="660" height="112" rx="18" fill="#FDE9E7" stroke="#E45756" stroke-width="2" opacity="1.0" filter="url(#shadow)"/>
<circle cx="494" cy="212" r="19" fill="#E45756" stroke="#FFFFFF" stroke-width="3"/>
<text x="530" y="200" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">L1 · GPU HBM</text>
<text x="530" y="234" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="500" text-anchor="start">命中即复用</text>
<rect x="952" y="194" width="126" height="36" rx="18" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0" opacity="1.0"/>
<text x="1015" y="219" fill="#E45756" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" text-anchor="middle">最低延迟</text>
<rect x="452" y="310" width="660" height="112" rx="18" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="2" opacity="1.0" filter="url(#shadow)"/>
<circle cx="494" cy="366" r="19" fill="#2F6FE4" stroke="#FFFFFF" stroke-width="3"/>
<text x="530" y="354" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">L2 · Host DRAM</text>
<text x="530" y="388" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="500" text-anchor="start">扩展容量</text>
<rect x="952" y="348" width="126" height="36" rx="18" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0" opacity="1.0"/>
<text x="1015" y="373" fill="#2F6FE4" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Pinned</text>
<rect x="452" y="464" width="660" height="112" rx="18" fill="#E2F5F1" stroke="#138A7E" stroke-width="2" opacity="1.0" filter="url(#shadow)"/>
<circle cx="494" cy="520" r="19" fill="#138A7E" stroke="#FFFFFF" stroke-width="3"/>
<text x="530" y="508" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">L3 · Storage</text>
<text x="530" y="542" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="500" text-anchor="start">跨实例共享</text>
<rect x="952" y="502" width="126" height="36" rx="18" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0" opacity="1.0"/>
<text x="1015" y="527" fill="#138A7E" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" text-anchor="middle">RDMA / FS</text>
<path d="M 364 275 C 405 275, 405 212, 452 212" fill="none" stroke="#7656D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-control)"/>
<path d="M 364 365 C 410 365, 410 366, 452 366" fill="none" stroke="#7656D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-control)"/>
<path d="M 364 455 C 405 455, 405 520, 452 520" fill="none" stroke="#7656D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-control)"/>
<line x1="780" y1="268" x2="780" y2="304" stroke="#637083" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
<text x="804" y="291" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" text-anchor="start">H2D / D2H</text>
<line x1="780" y1="422" x2="780" y2="458" stroke="#637083" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
<text x="804" y="445" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" text-anchor="start">get / set</text>
</svg>
