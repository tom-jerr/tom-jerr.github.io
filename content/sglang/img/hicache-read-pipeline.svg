<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">HiCache read pipeline</title>
<desc id="desc">Storage prefetch, host-to-device transfer and layer-wise forward execution overlap across scheduler, workers and GPU lanes.</desc>
