<text x="563.3333333333333" y="780.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="563.3333333333333" dy="0">Scheduler drain：分配 L2</tspan><tspan x="563.3333333333333" dy="24">不足则驱逐 / 缩短 / 撤销</tspan></text>
