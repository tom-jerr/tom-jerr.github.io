<text x="366.66666666666663" y="1436" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="366.66666666666663" dy="0">更新后的 L1 indices / L2 命中</tspan><tspan x="366.66666666666663" dy="22">交给 PrefillAdder 做入批判断</tspan></text>
<text x="42" y="1548" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" text-anchor="start">完整完成可由 drain 直接发布；提前终止由 check_prefetch_progress 发布。此图按完整成功路径排列。</text>
