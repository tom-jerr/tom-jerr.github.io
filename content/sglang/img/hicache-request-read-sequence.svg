<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1573" viewBox="0 0 1520 1573" role="img" aria-labelledby="title desc">
<title id="title">L3 预取：请求入队、后台 I/O、完成发布、重新匹配</title>
<desc id="desc">时间向下；实线为调用或提交，虚线为完成通知；不是等比例耗时。</desc>
