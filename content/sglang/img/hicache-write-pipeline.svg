<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">HiCache write pipeline</title>
<desc id="desc">The scheduler publishes a write operation, D2H and storage workers perform transfers, and acknowledgements return for commit and release.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#172033"/></marker>
<marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#637083"/></marker>
<marker id="arrow-gpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E45756"/></marker>
<marker id="arrow-cpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6FE4"/></marker>
<marker id="arrow-store" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#138A7E"/></marker>
<marker id="arrow-control" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7656D8"/></marker>
<marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2E8B57"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#172033" flood-opacity="0.09"/></filter>
</defs>
<rect width="1200" height="680" fill="#F8FAFD"/>
<text x="64" y="46" fill="#7656D8" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" text-anchor="start">WRITE PATH</text>
<text x="64" y="83" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="750" text-anchor="start">L1 → L2 → L3：非关键写入向后移</text>
<text x="64" y="114" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="450" text-anchor="start">write-through 可流水化；write-back 释放 GPU Slot 前必须完成 D2H</text>
<rect x="64" y="180" width="220" height="120" rx="18" fill="#EEE9FF" stroke="#7656D8" stroke-width="2" opacity="1.0" filter="url(#shadow)"/>
<circle cx="96" cy="211" r="18" fill="#7656D8" stroke="#FFFFFF" stroke-width="3"/>
<text x="96" y="218" fill="#FFFFFF" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="750" text-anchor="middle">1</text>
<text x="124" y="216" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="700" text-anchor="start">Scheduler</text>
<text x="124" y="248" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="450" text-anchor="start">reserve + lock</text>
<rect x="332" y="180" width="220" height="120" rx="18" fill="#FDE9E7" stroke="#E45756" stroke-width="2" opacity="1.0" filter="url(#shadow)"/>
<circle cx="364" cy="211" r="18" fill="#E45756" stroke="#FFFFFF" stroke-width="3"/>
<text x="364" y="218" fill="#FFFFFF" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="750" text-anchor="middle">2</text>
<text x="392" y="216" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="700" text-anchor="start">D2H Worker</text>
<text x="392" y="248" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="450" text-anchor="start">merge + submit</text>
<rect x="600" y="180" width="220" height="120" rx="18" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="2" opacity="1.0" filter="url(#shadow)"/>
<circle cx="632" cy="211" r="18" fill="#2F6FE4" stroke="#FFFFFF" stroke-width="3"/>
<text x="632" y="218" fill="#FFFFFF" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="750" text-anchor="middle">3</text>
<text x="660" y="216" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="700" text-anchor="start">L2 Host</text>
<text x="660" y="248" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="450" text-anchor="start">Pinned pool</text>
<rect x="868" y="180" width="268" height="120" rx="18" fill="#E2F5F1" stroke="#138A7E" stroke-width="2" opacity="1.0" filter="url(#shadow)"/>
<circle cx="900" cy="211" r="18" fill="#138A7E" stroke="#FFFFFF" stroke-width="3"/>
<text x="900" y="218" fill="#FFFFFF" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="750" text-anchor="middle">4</text>
<text x="928" y="216" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="700" text-anchor="start">Backup Worker</text>
<text x="928" y="248" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="450" text-anchor="start">batch_set → L3</text>
<line x1="284" y1="240" x2="332" y2="240" stroke="#172033" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="552" y1="240" x2="600" y2="240" stroke="#172033" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="820" y1="240" x2="868" y2="240" stroke="#172033" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="64" y="380" width="1072" height="190" rx="22" fill="#FFFFFF" stroke="#CAD3E1" stroke-width="2" opacity="1.0"/>
<text x="92" y="420" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" text-anchor="start">完成路径</text>
<line x1="202" y1="450" x2="1010" y2="450" stroke="#637083" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
<circle cx="260" cy="450" r="13" fill="#E45756" stroke="#E45756" stroke-width="0"/>
<text x="260" y="493" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="700" text-anchor="middle">D2H done</text>
<text x="260" y="520" fill="#637083" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="15" font-weight="500" text-anchor="middle">Ack</text>
<circle cx="520" cy="450" r="13" fill="#2F6FE4" stroke="#2F6FE4" stroke-width="0"/>
<text x="520" y="493" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="700" text-anchor="middle">L2 可复用</text>
<text x="520" y="520" fill="#637083" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="15" font-weight="500" text-anchor="middle">node.backuped</text>
<circle cx="780" cy="450" r="13" fill="#138A7E" stroke="#138A7E" stroke-width="0"/>
<text x="780" y="493" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="700" text-anchor="middle">L3 done</text>
<text x="780" y="520" fill="#637083" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="15" font-weight="500" text-anchor="middle">Ack</text>
<circle cx="1010" cy="450" r="13" fill="#7656D8" stroke="#7656D8" stroke-width="0"/>
<text x="1010" y="493" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Commit</text>
<text x="1010" y="520" fill="#637083" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="15" font-weight="500" text-anchor="middle">unlock / free</text>
<rect x="88" y="596" width="176" height="36" rx="18" fill="#E4F4EA" stroke="#E4F4EA" stroke-width="0" opacity="1.0"/>
<text x="176" y="621" fill="#2E8B57" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" text-anchor="middle">write-through</text>
<text x="286" y="620" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="600" text-anchor="start">Scheduler 不等 L3</text>
<rect x="690" y="596" width="156" height="36" rx="18" fill="#FFF2D6" stroke="#FFF2D6" stroke-width="0" opacity="1.0"/>
<text x="768" y="621" fill="#C47B10" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" text-anchor="middle">write-back</text>
<text x="870" y="620" fill="#C47B10" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="650" text-anchor="start">D2H 后才能回收源 Slot</text>
</svg>
