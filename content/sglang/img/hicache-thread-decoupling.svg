<text x="512" y="332" fill="#E45756" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" text-anchor="middle">bubble</text>
<text x="910" y="332" fill="#2E8B57" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700" text-anchor="middle">forward</text>
<rect x="944" y="144" width="166" height="36" rx="18" fill="#FDE9E7" stroke="#FDE9E7" stroke-width="0" opacity="1.0"/>
<text x="1027" y="169" fill="#E45756" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" text-anchor="middle">队首阻塞</text>
<text x="64" y="443" fill="#2E8B57" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="750" text-anchor="start">AFTER</text>
<rect x="64" y="462" width="1072" height="238" rx="22" fill="#E4F4EA" stroke="#2E8B57" stroke-width="2" opacity="1.0"/>
<text x="88" y="512" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="700" text-anchor="start">Scheduler</text>
<line x1="205" y1="504" x2="1094" y2="504" stroke="#CAD3E1" stroke-width="2" stroke-linecap="round"/>
