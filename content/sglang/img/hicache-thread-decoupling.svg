<text x="88" y="656" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="700" text-anchor="start">DMA / GPU</text>
<line x1="205" y1="648" x2="1094" y2="648" stroke="#CAD3E1" stroke-width="2" stroke-linecap="round"/>
<rect x="222" y="482" width="132" height="42" rx="10" fill="#EEE9FF" stroke="#7656D8" stroke-width="2" opacity="1.0"/>
<text x="288" y="510" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="650" text-anchor="middle">match</text>
<rect x="380" y="482" width="130" height="42" rx="10" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="2" opacity="1.0"/>
<text x="445" y="510" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="650" text-anchor="middle">enqueue</text>
<rect x="538" y="482" width="170" height="42" rx="10" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2" opacity="1.0"/>
<text x="623" y="510" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="650" text-anchor="middle">next batch</text>
<rect x="538" y="554" width="190" height="42" rx="10" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="2" opacity="1.0"/>
<text x="633" y="582" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="650" text-anchor="middle">索引 / 合并</text>
<rect x="754" y="554" width="140" height="42" rx="10" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="2" opacity="1.0"/>
<text x="824" y="582" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="650" text-anchor="middle">submit</text>
<rect x="754" y="626" width="244" height="42" rx="10" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2" opacity="1.0"/>
<text x="876" y="654" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="650" text-anchor="middle">copy  ∥  forward</text>
