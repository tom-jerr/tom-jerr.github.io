<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="770" viewBox="0 0 1880 770" role="img" aria-labelledby="title desc">
<title id="title">HiCache write policies</title>
<desc id="desc">Write-through and write-back differ at the trigger, but share D2H completion before L3 write.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#172033"/></marker>
<marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#637083"/></marker>
<marker id="arrow-gpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E45756"/></marker>
<marker id="arrow-cpu" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6FE4"/></marker>
<marker id="arrow-store" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#138A7E"/></marker>
<marker id="arrow-control" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7656D8"/></marker>
<marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2E8B57"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#172033" flood-opacity="0.09"/></filter>
</defs>
<rect width="1880" height="770" fill="#F8FAFD"/>
<text x="64" y="46" fill="#7656D8" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" text-anchor="start">WRITE PIPELINE</text>
<text x="64" y="83" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="750" text-anchor="start">三种写策略只改变触发点，不改变数据依赖</text>
<text x="64" y="114" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="450" text-anchor="start">L2 write = GPU→Host D2H；L3 write = Host→Storage batch_set</text>
<text x="35" y="202" fill="#172033" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="18" font-weight="700" text-anchor="start">write_through</text>
<line x1="495" y1="207" x2="565" y2="207" stroke="#2F6FE4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-cpu)"/>
<line x1="815" y1="207" x2="885" y2="207" stroke="#2F6FE4" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow-cpu)"/>
<line x1="1135" y1="207" x2="1205" y2="207" stroke="#138A7E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-store)"/>
<line x1="1455" y1="207" x2="1525" y2="207" stroke="#138A7E" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow-store)"/>
<rect x="245" y="165" width="250" height="84" rx="12" fill="#EEE9FF" stroke="#7656D8" stroke-width="2" opacity="1.0"/>
<text x="370" y="201" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan x="370" dy="0">insert / first hit</tspan><tspan x="370" dy="25">threshold = 1</tspan></text>
<rect x="565" y="165" width="250" height="84" rx="12" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="2" opacity="1.0"/>
<text x="690" y="201" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan x="690" dy="0">L2 WRITE</tspan><tspan x="690" dy="25">alloc Host + D2H</tspan></text>
<rect x="885" y="165" width="250" height="84" rx="12" fill="#E4F4EA" stroke="#2E8B57" stroke-width="2" opacity="1.0"/>
<text x="1010" y="201" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan x="1010" dy="0">D2H ACK</tspan><tspan x="1010" dy="25">Host bytes 有效</tspan></text>
<rect x="1205" y="165" width="250" height="84" rx="12" fill="#E2F5F1" stroke="#138A7E" stroke-width="2" opacity="1.0"/>
<text x="1330" y="201" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan x="1330" dy="0">L3 WRITE</tspan><tspan x="1330" dy="25">batch_set(_v1)</tspan></text>
<rect x="1525" y="165" width="250" height="84" rx="12" fill="#E4F4EA" stroke="#2E8B57" stroke-width="2" opacity="1.0"/>
<text x="1650" y="201" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan x="1650" dy="0">Storage ACK</tspan><tspan x="1650" dy="25">release Host ref</tspan></text>
<text x="245" y="284" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="550" text-anchor="start">pending 期间节点仍受 L1 lock_ref 保护</text>
<text x="35" y="382" fill="#172033" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="18" font-weight="700" text-anchor="start">selective</text>
<line x1="495" y1="387" x2="565" y2="387" stroke="#2F6FE4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-cpu)"/>
<line x1="815" y1="387" x2="885" y2="387" stroke="#2F6FE4" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow-cpu)"/>
<line x1="1135" y1="387" x2="1205" y2="387" stroke="#138A7E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-store)"/>
<line x1="1455" y1="387" x2="1525" y2="387" stroke="#138A7E" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow-store)"/>
<rect x="245" y="345" width="250" height="84" rx="12" fill="#EEE9FF" stroke="#7656D8" stroke-width="2" opacity="1.0"/>
<text x="370" y="381" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan x="370" dy="0">insert / reuse</tspan><tspan x="370" dy="25">threshold = 2</tspan></text>
<rect x="565" y="345" width="250" height="84" rx="12" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="2" opacity="1.0"/>
<text x="690" y="381" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan x="690" dy="0">L2 WRITE</tspan><tspan x="690" dy="25">alloc Host + D2H</tspan></text>
<rect x="885" y="345" width="250" height="84" rx="12" fill="#E4F4EA" stroke="#2E8B57" stroke-width="2" opacity="1.0"/>
<text x="1010" y="381" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan x="1010" dy="0">D2H ACK</tspan><tspan x="1010" dy="25">Host bytes 有效</tspan></text>
<rect x="1205" y="345" width="250" height="84" rx="12" fill="#E2F5F1" stroke="#138A7E" stroke-width="2" opacity="1.0"/>
<text x="1330" y="381" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan x="1330" dy="0">L3 WRITE</tspan><tspan x="1330" dy="25">batch_set(_v1)</tspan></text>
<rect x="1525" y="345" width="250" height="84" rx="12" fill="#E4F4EA" stroke="#2E8B57" stroke-width="2" opacity="1.0"/>
<text x="1650" y="381" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan x="1650" dy="0">Storage ACK</tspan><tspan x="1650" dy="25">release Host ref</tspan></text>
<text x="245" y="464" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="550" text-anchor="start">pending 期间节点仍受 L1 lock_ref 保护</text>
<text x="35" y="562" fill="#172033" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="18" font-weight="700" text-anchor="start">write_back</text>
<line x1="495" y1="567" x2="565" y2="567" stroke="#2F6FE4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-cpu)"/>
<line x1="815" y1="567" x2="885" y2="567" stroke="#2F6FE4" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow-cpu)"/>
<line x1="1135" y1="567" x2="1205" y2="567" stroke="#138A7E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-store)"/>
<line x1="1455" y1="567" x2="1525" y2="567" stroke="#138A7E" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow-store)"/>
<rect x="245" y="525" width="250" height="84" rx="12" fill="#EEE9FF" stroke="#7656D8" stroke-width="2" opacity="1.0"/>
<text x="370" y="561" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan x="370" dy="0">L1 eviction</tspan><tspan x="370" dy="25">no Host copy</tspan></text>
<rect x="565" y="525" width="250" height="84" rx="12" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="2" opacity="1.0"/>
<text x="690" y="561" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan x="690" dy="0">L2 WRITE</tspan><tspan x="690" dy="25">alloc Host + D2H</tspan></text>
<rect x="885" y="525" width="250" height="84" rx="12" fill="#E4F4EA" stroke="#2E8B57" stroke-width="2" opacity="1.0"/>
<text x="1010" y="561" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan x="1010" dy="0">D2H ACK</tspan><tspan x="1010" dy="25">Host bytes 有效</tspan></text>
<rect x="1205" y="525" width="250" height="84" rx="12" fill="#E2F5F1" stroke="#138A7E" stroke-width="2" opacity="1.0"/>
<text x="1330" y="561" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan x="1330" dy="0">L3 WRITE</tspan><tspan x="1330" dy="25">batch_set(_v1)</tspan></text>
<rect x="1525" y="525" width="250" height="84" rx="12" fill="#E4F4EA" stroke="#2E8B57" stroke-width="2" opacity="1.0"/>
<text x="1650" y="561" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="600" text-anchor="middle"><tspan x="1650" dy="0">Storage ACK</tspan><tspan x="1650" dy="25">release Host ref</tspan></text>
<text x="885" y="644" fill="#C47B10" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="650" text-anchor="start">D2H 完成后才能 free 源 GPU slots；无需等待 L3</text>
</svg>
