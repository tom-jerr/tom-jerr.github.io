<line x1="810" y1="311" x2="845" y2="311" stroke="#172033" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="435" y="150" width="170" height="62" rx="8" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="1.5" opacity="1.0"/>
<text x="520.0" y="173.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="520.0" dy="0">Layer 1 H2D</tspan><tspan x="520.0" dy="24">全部待恢复 pages</tspan></text>
<rect x="640" y="280" width="170" height="62" rx="8" fill="#FDE9E7" stroke="#E45756" stroke-width="1.5" opacity="1.0"/>
<text x="725.0" y="303.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="725.0" dy="0">Layer 1 Forward</tspan><tspan x="725.0" dy="24">计算未缓存 suffix</tspan></text>
<text x="636" y="249" fill="#2F6FE4" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" text-anchor="start">wait event 1</text>
<path d="M 810 181 L 827 181 L 827 311 L 845 311" fill="none" stroke="#2F6FE4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cpu)"/>
<line x1="810" y1="181" x2="845" y2="181" stroke="#172033" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1015" y1="311" x2="1050" y2="311" stroke="#172033" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="640" y="150" width="170" height="62" rx="8" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="1.5" opacity="1.0"/>
<text x="725.0" y="173.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="725.0" dy="0">Layer 2 H2D</tspan><tspan x="725.0" dy="24">全部待恢复 pages</tspan></text>
<rect x="845" y="280" width="170" height="62" rx="8" fill="#FDE9E7" stroke="#E45756" stroke-width="1.5" opacity="1.0"/>
<text x="930.0" y="303.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="930.0" dy="0">Layer 2 Forward</tspan><tspan x="930.0" dy="24">计算未缓存 suffix</tspan></text>
<text x="841" y="249" fill="#2F6FE4" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" text-anchor="start">wait event 2</text>
<path d="M 1015 181 L 1032 181 L 1032 311 L 1050 311" fill="none" stroke="#2F6FE4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-cpu)"/>
<rect x="845" y="150" width="170" height="62" rx="8" fill="#E8F0FF" stroke="#2F6FE4" stroke-width="1.5" opacity="1.0"/>
<text x="930.0" y="173.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="930.0" dy="0">Layer 3 H2D</tspan><tspan x="930.0" dy="24">全部待恢复 pages</tspan></text>
<rect x="1050" y="280" width="170" height="62" rx="8" fill="#FDE9E7" stroke="#E45756" stroke-width="1.5" opacity="1.0"/>
<text x="1135.0" y="303.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="1135.0" dy="0">Layer 3 Forward</tspan><tspan x="1135.0" dy="24">计算未缓存 suffix</tspan></text>
<text x="1046" y="249" fill="#2F6FE4" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" text-anchor="start">wait event 3</text>
<path d="M 1015 181 L 1270 181 L 1270 420 L 1150 420" fill="none" stroke="#637083" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-muted)"/>
<rect x="720" y="390" width="430" height="62" rx="8" fill="#FFFFFF" stroke="#7656D8" stroke-width="1.5" opacity="1.0"/>
<text x="935.0" y="427.0" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="550" text-anchor="middle"><tspan x="935.0" dy="0">loading_check：全量 H2D ACK 完成后释放搬运锁</tspan></text>
<text x="230" y="435" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" text-anchor="start">与 Forward 的逐层读取等待分开</text>
<line x1="210" y1="476" x2="1360" y2="476" stroke="#172033" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1270" y="465" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" text-anchor="start">时间 →</text>
</svg>
