<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="670" viewBox="0 0 1440 670" role="img" aria-label="Shadow prefix 思路：Full 历史与 SWA 窗口独立管理">
  <title>Shadow prefix 思路：Full 历史与 SWA 窗口独立管理</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#54677c" />
    </marker>
    <style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif}</style>
  </defs>
  <rect x="0" y="0" width="1440" height="670" fill="white" />
  <text x="35" y="34" fill="#17212e" font-size="25" font-weight="650" text-anchor="start" dominant-baseline="middle">Shadow prefix 思路：Full 历史与 SWA 窗口独立管理</text>
  <rect x="30" y="75" width="655" height="535" rx="11" fill="none" stroke="#aeb8c5" stroke-width="1.4" />
  <text x="48" y="100" fill="#526171" font-size="20" font-weight="650" text-anchor="start" dominant-baseline="middle">当前源码：UnifiedRadixCache + Full / SWA component</text>
  <rect x="65" y="135" width="580" height="70" rx="9" fill="#f5f7fa" stroke="#91a0b1" stroke-width="1.4" />
  <text x="355.0" y="156.5" fill="#17212e" font-size="19" font-weight="650" text-anchor="middle" dominant-baseline="middle">同一个 radix node</text>
  <text x="355.0" y="183.5" fill="#17212e" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle">Full component value + SWA component value</text>
  <rect x="65" y="265" width="250" height="85" rx="9" fill="#e9f5ef" stroke="#91a0b1" stroke-width="1.4" />
  <text x="190.0" y="294.0" fill="#17212e" font-size="18" font-weight="650" text-anchor="middle" dominant-baseline="middle">Full 路径锁 / 生命周期</text>
  <text x="190.0" y="321.0" fill="#17212e" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="middle">保留长期压缩历史</text>
  <rect x="395" y="265" width="250" height="85" rx="9" fill="#e8f1fa" stroke="#91a0b1" stroke-width="1.4" />
  <text x="520.0" y="294.0" fill="#17212e" font-size="18" font-weight="650" text-anchor="middle" dominant-baseline="middle">SWA 窗口锁 / LRU</text>
  <text x="520.0" y="321.0" fill="#17212e" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="middle">近期窗口独立回收</text>
  <polyline points="195,205 195,265" fill="none" stroke="#54677c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" />
  <polyline points="520,205 520,265" fill="none" stroke="#54677c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" />
  <rect x="65" y="410" width="580" height="95" rx="9" fill="#fff3db" stroke="#91a0b1" stroke-width="1.4" />
  <text x="355.0" y="430.5" fill="#17212e" font-size="19" font-weight="650" text-anchor="middle" dominant-baseline="middle">SWATokenToKVPoolAllocator</text>
  <text x="355.0" y="457.5" fill="#17212e" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle">full slot → SWA slot 映射</text>
  <text x="355.0" y="484.5" fill="#17212e" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle">Full 页同时确定 C4 / C128 压缩页地址</text>
  <polyline points="195,350 195,410" fill="none" stroke="#54677c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" />
  <polyline points="520,350 520,410" fill="none" stroke="#54677c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" />
  <text x="65" y="550" fill="#526171" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="middle">压缩页随 Full 页重用；压缩历史不靠 ring 自然淘汰</text>
  <rect x="725" y="75" width="680" height="535" rx="11" fill="none" stroke="#aeb8c5" stroke-width="1.4" />
  <text x="743" y="100" fill="#526171" font-size="20" font-weight="650" text-anchor="start" dominant-baseline="middle">窗口 = 4 的概念例子；不代表 DSV4 的实际页粒度</text>
  <rect x="775" y="135" width="220" height="75" rx="9" fill="#fff3db" stroke="#91a0b1" stroke-width="1.4" />
  <text x="885.0" y="159.0" fill="#17212e" font-size="19" font-weight="650" text-anchor="middle" dominant-baseline="middle">A：token 0,1</text>
  <text x="885.0" y="186.0" fill="#17212e" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle">Full 有 / SWA 无</text>
  <rect x="1080" y="135" width="270" height="75" rx="9" fill="#e8f1fa" stroke="#91a0b1" stroke-width="1.4" />
  <text x="1215.0" y="159.0" fill="#17212e" font-size="19" font-weight="650" text-anchor="middle" dominant-baseline="middle">B：token 2,3</text>
  <text x="1215.0" y="186.0" fill="#17212e" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle">Full 有 / SWA 有</text>
  <polyline points="995,172 1080,172" fill="none" stroke="#54677c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" />
  <rect x="1080" y="260" width="270" height="75" rx="9" fill="#e8f1fa" stroke="#91a0b1" stroke-width="1.4" />
  <text x="1215.0" y="284.0" fill="#17212e" font-size="19" font-weight="650" text-anchor="middle" dominant-baseline="middle">C：token 4,5</text>
  <text x="1215.0" y="311.0" fill="#17212e" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle">Full 有 / SWA 有</text>
  <polyline points="1215,210 1215,260" fill="none" stroke="#54677c" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" />
  <rect x="775" y="390" width="575" height="85" rx="9" fill="#e9f5ef" stroke="#91a0b1" stroke-width="1.4" />
  <text x="1062.5" y="419.0" fill="#17212e" font-size="18" font-weight="650" text-anchor="middle" dominant-baseline="middle">匹配到 C：SWA 连续覆盖4 token，可复用</text>
  <text x="1062.5" y="446.0" fill="#17212e" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="middle">只匹配到 B：覆盖2 token，回退到安全边界</text>
  <text x="775" y="528" fill="#17212e" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="middle">内部 SWA 驱逐 → tombstone，保留 Full / radix key</text>
  <text x="775" y="566" fill="#17212e" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="middle">叶子被驱逐 → 回收整节点；必要时清理 tombstone 祖先</text>
  <text x="35" y="642" fill="#526171" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="middle">HiCache / request-ring 等路径另有恢复规则；图示为常规 paged SWA 的设备缓存。</text>
</svg>