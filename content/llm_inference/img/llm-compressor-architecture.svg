<text x="1190" y="219" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="700" text-anchor="start">Modifier</text>
<text x="1190" y="253" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" text-anchor="start">hooks / observer / 改写权重</text>
<rect x="64" y="440" width="258" height="142" rx="12" fill="#E2F5F1" stroke="#138A7E" stroke-width="2" opacity="1.0"/>
<text x="84" y="475" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="700" text-anchor="start">model_free_ptq</text>
<text x="84" y="509" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" text-anchor="start">safetensors / data-free</text>
<rect x="1170" y="440" width="266" height="142" rx="12" fill="#E4F4EA" stroke="#2E8B57" stroke-width="2" opacity="1.0"/>
<text x="1190" y="475" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="700" text-anchor="start">compressed-tensors</text>
<text x="1190" y="509" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" text-anchor="start">权重 + qparams + config</text>
<line x1="1303" y1="582" x2="1303" y2="634" stroke="#2E8B57" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ok)"/>
<text x="1303" y="677" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">vLLM 加载 → 运行时量化实现</text>
<text x="64" y="625" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="500" text-anchor="start">model_free_ptq 不创建完整 HF Module；不执行 GPTQ / AWQ 等需要校准数据的算法。</text>
</svg>
