<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-labelledby="title desc">
  <title id="title">DSpark cycle parallel module</title>
  <desc id="desc">Parallel module produces draft logits for all positions</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .label{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .token{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .box{rx:8;fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .amber{fill:#fffbeb;stroke:#d97706}
      .blue{fill:#eff6ff;stroke:#2563eb}
      .line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="880" height="240" fill="#ffffff"/>
  <text x="32" y="38" class="label">Step 2: parallel draft logits</text>
  <rect x="58" y="88" width="190" height="86" class="box blue"/>
  <text x="93" y="118" class="label">Input to DFlash</text>
  <text x="90" y="150" class="token">D  [M] [M] [M]</text>
  <path d="M248 131 H340" class="line"/>
  <rect x="350" y="70" width="180" height="122" class="box amber"/>
  <text x="392" y="112" class="label">DFlash</text>
  <text x="385" y="140" class="small">one parallel pass</text>
  <text x="390" y="164" class="small">positions 1..4</text>
  <path d="M530 131 H620" class="line"/>
  <rect x="630" y="74" width="188" height="114" class="box blue"/>
  <text x="676" y="106" class="label">Base logits</text>
  <text x="666" y="134" class="small">U1, U2, U3, U4</text>
  <text x="655" y="160" class="small">shape: gamma x vocab</text>
</svg>
