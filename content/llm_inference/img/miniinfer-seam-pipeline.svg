<text x="964" y="696" fill="#C47B10" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="13" font-weight="650" text-anchor="middle">device_fence(N)</text>
<line x1="1260" y1="644" x2="1260" y2="672" stroke="#2E8B57" stroke-width="3" stroke-linecap="round"/>
<text x="1260" y="628" fill="#2E8B57" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="13" font-weight="650" text-anchor="middle">result N+1 ready</text>
