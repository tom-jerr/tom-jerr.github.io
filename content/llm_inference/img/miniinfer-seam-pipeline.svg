<text x="268" y="900" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" text-anchor="start">CPU 控制面动作</text>
<rect x="430" y="886" width="40" height="18" rx="6" fill="#FFFFFF" stroke="#E45756" stroke-width="2" opacity="1.0"/>
<text x="484" y="900" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" text-anchor="start">GPU 计算</text>
<rect x="600" y="886" width="40" height="18" rx="6" fill="#E4F4EA" stroke="#2E8B57" stroke-width="2" opacity="1.0"/>
<text x="654" y="900" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" text-anchor="start">future_map / 栅栏事件</text>
<rect x="856" y="886" width="40" height="18" rx="6" fill="#FFF2D6" stroke="#C47B10" stroke-width="2" opacity="1.0"/>
<text x="910" y="900" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" text-anchor="start">阻塞等待</text>
<text x="84" y="966" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" text-anchor="start">读法：CPU 在 forward N 还在执行时就完成了 plan N+1 并发出 launch N+1；</text>
<text x="84" y="996" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="600" text-anchor="start">commit N 只等 result N，一旦拿到就回执页栅栏。event 行只画 gate 了可见动作的事件。</text>
</svg>
