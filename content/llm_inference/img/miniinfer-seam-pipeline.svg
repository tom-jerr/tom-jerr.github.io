<text x="64" y="83" fill="#172033" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="750" text-anchor="start">先 launch 下一步，再读回上一步的 token</text>
<text x="64" y="114" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="450" text-anchor="start">横向是时间；同一 CUDA stream 内 h2d → forward → sample → scatter 顺序执行。示意图，不按比例</text>
