<path d="M 824 676 L 824 338" fill="none" stroke="#2E8B57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-ok)"/>
<line x1="1260" y1="272" x2="1260" y2="328" stroke="#2E8B57" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7"/>
<path d="M 1260 676 L 1260 338" fill="none" stroke="#2E8B57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-ok)"/>
<path d="M 452 676 L 452 700 L 1012 700 L 1012 432" fill="none" stroke="#637083" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-muted)"/>
<text x="84" y="582" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" text-anchor="start">同一条 stream 的顺序：h2d N → forward N → sample N → scatter N（写 future_map）→ h2d N+1 → forward N+1（gather 读回）→ …</text>
<text x="84" y="714" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" text-anchor="start">arena 环：plan N+2 复用槽 N 前需 h2d N 事件置位；图中早已置位，没有等待。</text>
<text x="816" y="714" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" text-anchor="start">commit N：816 到达 → 等 result N → 964 返回并回执 device_fence(N)</text>
<rect x="280" y="760" width="620" height="96" rx="12" fill="#E4F4EA" stroke="#2E8B57" stroke-width="2" opacity="1.0"/>
<text x="300" y="792" fill="#2E8B57" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="750" text-anchor="start">页释放栅栏</text>
<text x="300" y="820" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" text-anchor="start">plan N+1 期间驱逐的页挂在 frontier N；commit N 调 device_fence(N) 后它们才回到 free list</text>
<text x="300" y="842" fill="#637083" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="13" font-weight="500" text-anchor="start">kv.rs:158 note_device_fence → release_now → generation++</text>
<rect x="940" y="760" width="590" height="96" rx="12" fill="#FFF2D6" stroke="#C47B10" stroke-width="2" opacity="1.0"/>
<text x="960" y="792" fill="#C47B10" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="750" text-anchor="start">页不足时的反应路径</text>
<text x="960" y="820" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" text-anchor="start">Engine.step 抛 KvOutOfPages → 驱动先 commit 最老的一批（推进栅栏）→ 重试 plan</text>
<text x="960" y="842" fill="#637083" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="13" font-weight="500" text-anchor="start">_drain_pipelined · rust_control_plane.py:543</text>
<text x="84" y="900" fill="#637083" font-family="Inter, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" text-anchor="start">已发出（issue）</text>
