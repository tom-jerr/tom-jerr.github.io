<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-labelledby="title desc">
  <title id="title">DSpark cycle prefill</title>
  <desc id="desc">Target model prefill creates the anchor token</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .label{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .token{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .box{rx:8;fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .blue{fill:#eff6ff;stroke:#2563eb}
      .violet{fill:#f5f3ff;stroke:#7c3aed}
      .line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="880" height="220" fill="#ffffff"/>
  <text x="32" y="38" class="label">Step 1: target prefill</text>
  <rect x="70" y="82" width="170" height="82" class="box blue"/>
  <text x="105" y="112" class="label">Prompt tokens</text>
  <text x="118" y="146" class="token">A  B  C</text>
  <path d="M240 123 H340" class="line"/>
  <rect x="348" y="72" width="190" height="102" class="box violet"/>
  <text x="394" y="112" class="label">Target model</text>
  <text x="402" y="142" class="small">one forward pass</text>
  <path d="M538 123 H640" class="line"/>
  <rect x="650" y="82" width="138" height="82" class="box blue"/>
  <text x="682" y="112" class="label">Anchor</text>
  <text x="710" y="146" class="token">D</text>
</svg>
