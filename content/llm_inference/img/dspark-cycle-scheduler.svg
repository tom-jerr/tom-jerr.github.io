<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-labelledby="title desc">
  <title id="title">DSpark cycle scheduler</title>
  <desc id="desc">Hardware aware scheduler keeps the high-confidence prefix</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .label{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .token{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .box{rx:8;fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .green{fill:#ecfdf5;stroke:#059669}
      .red{fill:#fef2f2;stroke:#dc2626}
      .violet{fill:#f5f3ff;stroke:#7c3aed}
      .line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="880" height="260" fill="#ffffff"/>
  <text x="32" y="38" class="label">Step 4: hardware-aware prefix scheduling</text>
  <rect x="50" y="88" width="220" height="100" class="box green"/>
  <text x="92" y="118" class="label">Draft candidates</text>
  <text x="88" y="148" class="token">E  F  G  H</text>
  <text x="76" y="172" class="small">c1 high, c2 high, c3 ok, c4 low</text>
  <path d="M270 138 H350" class="line"/>
  <rect x="360" y="72" width="190" height="132" class="box violet"/>
  <text x="390" y="106" class="label">Scheduler</text>
  <text x="388" y="134" class="small">checks confidence</text>
  <text x="388" y="158" class="small">and current load</text>
  <text x="397" y="182" class="small">choose prefix length</text>
  <path d="M550 118 H620" class="line"/>
  <rect x="630" y="78" width="178" height="72" class="box green"/>
  <text x="670" y="106" class="label">Keep prefix</text>
  <text x="690" y="134" class="token">E F G</text>
  <path d="M550 170 H620" class="line"/>
  <rect x="630" y="162" width="178" height="54" class="box red"/>
  <text x="682" y="194" class="label">Drop H</text>
</svg>
