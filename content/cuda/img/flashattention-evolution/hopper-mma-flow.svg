<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
<title id="title">Hopper · WGMMA：异步读 SMEM，结果仍由 warpgroup 的寄存器持有</title><desc id="desc">图示 SS 输入路径；RS 变体的 A 来自寄存器，B 仍来自 SMEM。WGMMA 是 128-thread collective。 执行顺序：operand ready + fence → issue MMA → commit_group → 独立工作 → wait_group → 读 D。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#637381"/></marker></defs>
<rect width="1440" height="440" fill="white"/>
<text x="32" y="39" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#263238">Hopper · WGMMA：异步读 SMEM，结果仍由 warpgroup 的寄存器持有</text>
<text x="32" y="69" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#586975">图示 SS 输入路径；RS 变体的 A 来自寄存器，B 仍来自 SMEM。WGMMA 是 128-thread collective。</text>
<rect x="159" y="96" width="570" height="43" rx="6" fill="#f4f5f7" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="444" y="123" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#263238">4 warps / 128 threads → collective issue</text>
<path d="M444 139 L444 176" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="4 5"/>
<rect x="40" y="180" width="256" height="84" rx="6" fill="#e1f3ef" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="168" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">Shared Memory</text>
<text x="168" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">A / B：SMEM descriptor</text>
<path d="M297 221 L313 221" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="305" y="286" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#263238">直接读 operand</text>
<rect x="316" y="180" width="256" height="84" rx="6" fill="#e9eefb" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="444" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">第 4 代 Tensor Core</text>
<text x="444" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">wgmma.mma_async</text>
<path d="M573 221 L589 221" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="581" y="286" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#263238">异步写回</text>
<rect x="592" y="180" width="256" height="84" rx="6" fill="#f4f5f7" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="720" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">Register File</text>
<text x="720" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">D：warpgroup accumulator</text>
<path d="M849 221 L865 221" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="857" y="286" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#263238">结果就绪门槛</text>
<rect x="868" y="180" width="256" height="84" rx="6" fill="#f6e4ed" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="996" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">等待对应 async group</text>
<text x="996" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">wgmma.wait_group</text>
<path d="M1125 221 L1141 221" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="1133" y="286" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#263238">安全访问 fragment</text>
<rect x="1144" y="180" width="256" height="84" rx="6" fill="#fff0cc" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="1272" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">CUDA Core / MUFU</text>
<text x="1272" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">softmax 使用 D</text>
<text x="40" y="335" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="start" font-weight="400" fill="#263238">执行顺序：operand ready + fence → issue MMA → commit_group → 独立工作 → wait_group → 读 D。</text>
<text x="40" y="381" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="start" font-weight="400" fill="#263238">wait 之前不能读写在途 accumulator；SMEM operand 也不能在异步读取完成前被覆盖。</text>
<text x="40" y="416" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#586975">wgmma.fence 管寄存器访问次序；普通 SMEM store → async reader 还要检查 proxy ordering。</text>
</svg>
