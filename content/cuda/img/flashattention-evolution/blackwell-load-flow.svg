<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
<title id="title">Blackwell SM100 · TMA load：保留 G2S 路径，扩展 CTA-pair 完成通知</title><desc id="desc">普通 1-CTA load 仍类似 Hopper；图下重点说明 .cta_group::2，不把它画成自动搬两份数据。 .cta_group::2：load 的 complete_tx 可通知 destination CTA 或其 peer CTA 中的 mbarrier。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#637381"/></marker></defs>
