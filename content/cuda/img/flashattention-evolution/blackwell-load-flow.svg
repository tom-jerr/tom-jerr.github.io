<text x="32" y="39" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#263238">Blackwell SM100 · TMA load：保留 G2S 路径，扩展 CTA-pair 完成通知</text>
<text x="32" y="69" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#586975">普通 1-CTA load 仍类似 Hopper；图下重点说明 .cta_group::2，不把它画成自动搬两份数据。</text>
<rect x="159" y="96" width="570" height="43" rx="6" fill="#f4f5f7" stroke="#a7b3bd" stroke-width="1.2"/>
