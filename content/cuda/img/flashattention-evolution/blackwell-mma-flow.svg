<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
<title id="title">Blackwell SM100 · tcgen05.mma：单线程发起，accumulator 写入 TMEM</title><desc id="desc">图示 SS 输入路径；TS 变体让 A 直接来自 TMEM。寄存器不再长期承载整个 MMA accumulator。 完成协议：MMA → tcgen05.commit / mbarrier → consumer wait / ordering → tcgen05.ld → wait::ld。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#637381"/></marker></defs>
<rect width="1440" height="440" fill="white"/>
<text x="32" y="39" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#263238">Blackwell SM100 · tcgen05.mma：单线程发起，accumulator 写入 TMEM</text>
<text x="32" y="69" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#586975">图示 SS 输入路径；TS 变体让 A 直接来自 TMEM。寄存器不再长期承载整个 MMA accumulator。</text>
<rect x="159" y="96" width="570" height="43" rx="6" fill="#f4f5f7" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="444" y="123" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#263238">一个 elected thread → tcgen05.mma issue</text>
<path d="M444 139 L444 176" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="4 5"/>
<rect x="40" y="180" width="256" height="84" rx="6" fill="#e1f3ef" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="168" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">Shared Memory</text>
<text x="168" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">A / B：SMEM descriptor</text>
<path d="M297 221 L313 221" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="305" y="286" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#263238">直接读 operand</text>
<rect x="316" y="180" width="256" height="84" rx="6" fill="#e9eefb" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="444" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">第 5 代 Tensor Core</text>
<text x="444" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">tcgen05.mma</text>
<path d="M573 221 L589 221" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="581" y="286" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#263238">异步写 TMEM</text>
<rect x="592" y="180" width="256" height="84" rx="6" fill="#e1f3ef" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="720" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">Tensor Memory</text>
<text x="720" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">D / 累加值：TMEM</text>
<path d="M849 221 L865 221" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="857" y="286" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#263238">完成后 tcgen05.ld</text>
<rect x="868" y="180" width="256" height="84" rx="6" fill="#f4f5f7" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="996" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">Register File</text>
<text x="996" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">tcgen05.ld 后的 fragment</text>
<path d="M1125 221 L1141 221" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="1133" y="286" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#263238">wait::ld 后使用</text>
<rect x="1144" y="180" width="256" height="84" rx="6" fill="#fff0cc" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="1272" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">CUDA Core / MUFU</text>
<text x="1272" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">softmax / correction</text>
<text x="40" y="335" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="start" font-weight="400" fill="#263238">完成协议：MMA → tcgen05.commit / mbarrier → consumer wait / ordering → tcgen05.ld → wait::ld。</text>
<text x="40" y="381" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="start" font-weight="400" fill="#263238">MMA 单线程发起 ≠ TMEM load/store 单线程完成；tcgen05.ld / st 是 warp collective。</text>
<text x="40" y="416" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#586975">2-CTA MMA 可由 CTA pair 中一个线程发起，peer CTA 必须存活；相关资源按配对协议管理。</text>
</svg>
