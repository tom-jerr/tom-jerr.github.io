<text x="32" y="397" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="20" text-anchor="start" font-weight="400" fill="#263238">TMEM 长期保留：dK、dV；轮转区：S / P，以及 dP / dS / dQ。</text>
<text x="32" y="434" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="start" font-weight="400" fill="#263238">覆盖旧名字之前，必须完成读取 / staging / reduction；图中不展开这些 buffer 交接。</text>
<text x="32" y="483" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="start" font-weight="400" fill="#586975">prologue 先产生第一轮 P、dP、dS；tail 排空最后的 dK / dQ。不能直接删掉首尾。</text>
</svg>
