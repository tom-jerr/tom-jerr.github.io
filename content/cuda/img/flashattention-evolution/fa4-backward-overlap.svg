<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="540" viewBox="0 0 1340 540" role="img" aria-labelledby="title desc">
<title id="title">FA4 backward overlap</title><desc id="desc">1-CTA 主循环：S_j、dK_(j-1)、dQ_(j-1)、dP_j、dV_j；softmax 重算与上一迭代的梯度 MMA 重叠。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#637381"/></marker></defs>
<rect width="1340" height="540" fill="white"/>
<text x="32" y="39" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#263238">FA4 backward · 用上一轮的梯度 MMA 覆盖本轮 softmax</text>
<text x="32" y="69" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#586975">1-CTA 稳态的逻辑调度；j 表示固定 KV tile 下扫描的 Q tile。2-CTA 的 dP / dQ 顺序另有调整。</text>
<text x="185" y="163" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="end" font-weight="700" fill="#263238">Tensor Core</text>
