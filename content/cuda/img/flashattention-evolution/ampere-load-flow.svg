<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
<title id="title">Ampere · cp.async：还没有 TMA，由线程生成每段地址</title><desc id="desc">单条 cp.async 搬 4 / 8 / 16 bytes（取决于变体）；多个线程的请求组成 tile。数据绕过通用 RF 中转。 完成协议：cp.async → commit_group → 独立计算 → wait_group → 必要的 CTA 同步 → consume。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#637381"/></marker></defs>
<rect width="1440" height="440" fill="white"/>
<text x="32" y="39" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#263238">Ampere · cp.async：还没有 TMA，由线程生成每段地址</text>
<text x="32" y="69" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#586975">单条 cp.async 搬 4 / 8 / 16 bytes（取决于变体）；多个线程的请求组成 tile。数据绕过通用 RF 中转。</text>
<rect x="435" y="96" width="570" height="43" rx="6" fill="#f4f5f7" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="720" y="123" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#263238">各 copy thread：地址计算 / predicate → cp.async</text>
<path d="M720 139 L720 176" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="4 5"/>
<rect x="40" y="180" width="256" height="84" rx="6" fill="#f4f5f7" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="168" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">HBM</text>
<text x="168" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">global 源数据</text>
<path d="M297 221 L313 221" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="305" y="286" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#263238">L2 miss 时取数</text>
<rect x="316" y="180" width="256" height="84" rx="6" fill="#f4f5f7" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="444" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">L2 / cache path</text>
<text x="444" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">.ca 与 .cg 策略不同</text>
<path d="M573 221 L589 221" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="581" y="286" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#263238">cache 数据供给</text>
<rect x="592" y="180" width="256" height="84" rx="6" fill="#e1f3ef" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="720" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">异步 global→shared 路径</text>
<text x="720" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">硬件推进 copy</text>
<path d="M849 221 L865 221" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="857" y="286" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#263238">直接写 SMEM</text>
<rect x="868" y="180" width="256" height="84" rx="6" fill="#e1f3ef" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="996" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">Shared Memory</text>
<text x="996" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">本 CTA 的 tile buffer</text>
<path d="M1125 221 L1141 221" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="1133" y="286" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#263238">copy ready 后读取</text>
<rect x="1144" y="180" width="256" height="84" rx="6" fill="#e9eefb" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="1272" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">MMA consumer</text>
<text x="1272" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">ldmatrix → RF → mma.sync</text>
<text x="40" y="335" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="start" font-weight="400" fill="#263238">完成协议：cp.async → commit_group → 独立计算 → wait_group → 必要的 CTA 同步 → consume。</text>
<text x="40" y="381" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="start" font-weight="400" fill="#263238">每线程保留地址 / predicate 寄存器，但没有 payload 的 global-load → RF → shared-store 中转。</text>
<text x="40" y="416" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#586975">cp.async.wait_group 追踪发起线程的 copy groups；它不是整个 CTA 的通用 barrier。</text>
</svg>
