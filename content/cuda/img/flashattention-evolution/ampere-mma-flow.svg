<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
<title id="title">Ampere · mma.sync：warp 持有输入和输出 fragment</title><desc id="desc">示例为 FP16/BF16 → FP32 的 warp MMA；数据已先搬到 SMEM。实线是数据，虚线是发起。 执行顺序：准备 fragment → 全 warp 发起 mma.sync → 结果依赖由 scoreboard 追踪 → 消费 D。</desc>
