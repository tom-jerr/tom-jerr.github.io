<text x="32" y="39" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#263238">Ampere · mma.sync：warp 持有输入和输出 fragment</text>
<text x="32" y="69" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#586975">示例为 FP16/BF16 → FP32 的 warp MMA；数据已先搬到 SMEM。实线是数据，虚线是发起。</text>
<rect x="435" y="96" width="570" height="43" rx="6" fill="#f4f5f7" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="720" y="123" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#263238">32-thread warp → SM instruction issue</text>
<path d="M720 139 L720 176" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="4 5"/>
<rect x="40" y="180" width="256" height="84" rx="6" fill="#e1f3ef" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="168" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">Shared Memory</text>
<text x="168" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">A / B tile</text>
<path d="M297 221 L313 221" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="305" y="286" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#263238">ldmatrix</text>
<rect x="316" y="180" width="256" height="84" rx="6" fill="#f4f5f7" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="444" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">Register File</text>
<text x="444" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">A / B / C fragments</text>
<path d="M573 221 L589 221" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="581" y="286" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#263238">operand read</text>
<rect x="592" y="180" width="256" height="84" rx="6" fill="#e9eefb" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="720" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">第 3 代 Tensor Core</text>
<text x="720" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">mma.sync</text>
<path d="M849 221 L865 221" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="857" y="286" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#263238">writeback</text>
<rect x="868" y="180" width="256" height="84" rx="6" fill="#f4f5f7" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="996" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">Register File</text>
<text x="996" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">D：FP32 accumulator</text>
<path d="M1125 221 L1141 221" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="1133" y="286" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="400" fill="#263238">依赖就绪后读取</text>
<rect x="1144" y="180" width="256" height="84" rx="6" fill="#fff0cc" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="1272" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#263238">CUDA Core / MUFU</text>
<text x="1272" y="244" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">softmax / 行统计量</text>
<text x="40" y="335" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="start" font-weight="400" fill="#263238">执行顺序：准备 fragment → 全 warp 发起 mma.sync → 结果依赖由 scoreboard 追踪 → 消费 D。</text>
<text x="40" y="381" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="start" font-weight="400" fill="#263238">.sync 约束参与线程会合，不是整个 CTA / GPU 同步；其他 warp 或独立指令仍可推进。</text>
<text x="40" y="416" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#586975">本路径没有 WGMMA 式 commit / wait_group；C 与 D 可以使用同一组寄存器做累加。</text>
</svg>
