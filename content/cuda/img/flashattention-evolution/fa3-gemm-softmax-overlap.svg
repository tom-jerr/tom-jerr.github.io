<rect x="594" y="139" width="183" height="44" rx="6" fill="#e9eefb" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="685.5" y="167" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#263238">PV → QK</text>
<rect x="594" y="204" width="183" height="44" rx="6" fill="#fff0cc" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="685.5" y="232" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#263238">softmax</text>
<rect x="970" y="139" width="183" height="44" rx="6" fill="#e9eefb" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="1061.5" y="167" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#263238">PV → QK</text>
<rect x="970" y="204" width="183" height="44" rx="6" fill="#fff0cc" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="1061.5" y="232" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#263238">softmax</text>
<rect x="406" y="139" width="183" height="44" rx="6" fill="#fff0cc" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="497.5" y="167" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#263238">softmax</text>
<rect x="406" y="204" width="183" height="44" rx="6" fill="#e9eefb" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="497.5" y="232" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#263238">PV → QK</text>
<rect x="782" y="139" width="183" height="44" rx="6" fill="#fff0cc" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="873.5" y="167" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#263238">softmax</text>
<rect x="782" y="204" width="183" height="44" rx="6" fill="#e9eefb" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="873.5" y="232" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#263238">PV → QK</text>
<text x="218" y="288" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#263238">一个组使用 Tensor Core 时，让另一个组使用 MUFU；两组交替进入重计算区。</text>
<text x="32" y="346" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" text-anchor="start" font-weight="700" fill="#263238">B. 一个 consumer warpgroup：跨 KV 迭代的软件流水</text>
<text x="185" y="408" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="end" font-weight="700" fill="#263238">Tensor Core</text>
<path d="M210 426 L1190 426" fill="none" stroke="#637381" stroke-width="1.3" stroke-dasharray="4 5"/>
<text x="185" y="490" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="end" font-weight="700" fill="#263238">标量 / MUFU</text>
<path d="M210 508 L1190 508" fill="none" stroke="#637381" stroke-width="1.3" stroke-dasharray="4 5"/>
<rect x="218" y="378" width="183" height="44" rx="6" fill="#e9eefb" stroke="#a7b3bd" stroke-width="1.2"/>
