<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" role="img" aria-labelledby="title desc">
<title id="title">FA3 两种 GEMM–softmax overlap</title><desc id="desc">上部为跨 warpgroup 的 ping-pong，下部为同一 warpgroup 跨迭代的 PV 与下一块 softmax 重叠。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#637381"/></marker></defs>
<rect width="1240" height="690" fill="white"/>
<text x="32" y="39" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#263238">FA3 · WGMMA 异步后，找到独立的 softmax 工作</text>
<text x="32" y="69" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#586975">稳态示意，省略 TMA lane 和 prologue / tail；所有 PV 都必须等待自己的 P。</text>
<text x="32" y="111" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="21" text-anchor="start" font-weight="700" fill="#263238">A. 两个 consumer warpgroup：ping-pong</text>
<text x="185" y="169" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="end" font-weight="700" fill="#263238">consumer A</text>
<path d="M210 187 L1190 187" fill="none" stroke="#637381" stroke-width="1.3" stroke-dasharray="4 5"/>
<text x="185" y="234" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="end" font-weight="700" fill="#263238">consumer B</text>
<path d="M210 252 L1190 252" fill="none" stroke="#637381" stroke-width="1.3" stroke-dasharray="4 5"/>
<rect x="218" y="139" width="183" height="44" rx="6" fill="#e9eefb" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="309.5" y="167" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="400" fill="#263238">PV → QK</text>
