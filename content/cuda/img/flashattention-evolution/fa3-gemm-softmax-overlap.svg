<rect x="406" y="460" width="183" height="44" rx="6" fill="#fff0cc" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="497.5" y="488" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="400" fill="#263238">softmaxⱼ</text>
<rect x="594" y="460" width="89" height="44" rx="6" fill="#f6e4ed" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="638.5" y="488" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="400" fill="#263238">校正 O</text>
<rect x="876" y="460" width="183" height="44" rx="6" fill="#fff0cc" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="967.5" y="488" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="400" fill="#263238">softmaxⱼ₊₁</text>
<rect x="1064" y="460" width="89" height="44" rx="6" fill="#f6e4ed" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="1108.5" y="488" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="400" fill="#263238">校正 O</text>
<path d="M403 422 L403 457" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M591 422 L591 457" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M873 422 L873 457" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M218 545 L1190 545" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="1190" y="569" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="end" font-weight="400" fill="#586975">逻辑时间 →（非实测比例）</text>
<text x="32" y="615" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="20" text-anchor="start" font-weight="400" fill="#263238">QKⱼ 完成后可读 Sⱼ；PVⱼ₋₁ 完成后才可改写 O 或复用 Pⱼ₋₁ 的寄存器。</text>
<text x="32" y="652" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#586975">同时在途的 accumulator / P buffer 增加寄存器压力；SMEM stage 数不等于这层流水深度。</text>
</svg>
