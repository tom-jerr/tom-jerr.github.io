<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="710" viewBox="0 0 1340 710" role="img" aria-labelledby="title desc">
<title id="title">FA4 forward overlap</title><desc id="desc">L/H 为两个独立 query tile。MMA、softmax、correction 通过 TMEM 和 barrier 交接；O 校正必须在对应 PV 之前完成。</desc>
