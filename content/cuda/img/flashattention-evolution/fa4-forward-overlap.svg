<text x="32" y="39" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#263238">FA4 · TMEM 把 MMA、softmax 与输出校正分开</text>
<text x="32" y="69" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#586975">L / H 各是一个 128-row Q tile；j 是 KV tile。仅表示合法依赖，省略 P 分段提交及边界阶段。</text>
