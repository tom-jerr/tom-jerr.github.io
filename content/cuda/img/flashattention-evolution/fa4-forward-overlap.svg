<text x="32" y="635" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="20" text-anchor="start" font-weight="400" fill="#263238">两个 softmax 组错开指数计算；correction 可与另一 Q tile 的 MMA / softmax 重叠。</text>
<text x="32" y="674" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="start" font-weight="400" fill="#586975">同一 O 的 rescale 与 PV 写回仍互斥。TMEM 提供交接位置，不会自动解除数据依赖。</text>
