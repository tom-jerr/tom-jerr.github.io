<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="440" viewBox="0 0 1240 440" role="img" aria-labelledby="title desc">
<title id="title">FA2：copy–compute overlap</title><desc id="desc">双缓冲复用必须在旧消费者读完之后；tile 内部的 QK、softmax、PV 仍有依赖。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#637381"/></marker></defs>
<rect width="1240" height="440" fill="white"/>
<text x="32" y="39" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="26" text-anchor="start" font-weight="700" fill="#263238">FA2 · 下一块搬运藏在当前块计算后面</text>
<text x="32" y="69" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#586975">Ampere-style cp.async + mma.sync；画出两块 SMEM buffer 的保守复用顺序。</text>
<text x="185" y="148" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="end" font-weight="700" fill="#263238">异步 copy</text>
<path d="M210 166 L1190 166" fill="none" stroke="#637381" stroke-width="1.3" stroke-dasharray="4 5"/>
<text x="185" y="238" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="18" text-anchor="end" font-weight="700" fill="#263238">计算线程</text>
<path d="M210 256 L1190 256" fill="none" stroke="#637381" stroke-width="1.3" stroke-dasharray="4 5"/>
<rect x="218" y="118" width="89" height="44" rx="6" fill="#e1f3ef" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="262.5" y="146" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">KV₀ → A</text>
<rect x="312" y="118" width="183" height="44" rx="6" fill="#e1f3ef" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="403.5" y="146" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">KV₁ → B</text>
<rect x="594" y="118" width="183" height="44" rx="6" fill="#e1f3ef" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="685.5" y="146" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">KV₂ → A</text>
<rect x="876" y="118" width="183" height="44" rx="6" fill="#e1f3ef" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="967.5" y="146" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">KV₃ → B</text>
<rect x="312" y="208" width="89" height="44" rx="6" fill="#e9eefb" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="356.5" y="236" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">QK₀</text>
<rect x="406" y="208" width="89" height="44" rx="6" fill="#fff0cc" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="450.5" y="236" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">softmax₀</text>
<rect x="500" y="208" width="89" height="44" rx="6" fill="#e9eefb" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="544.5" y="236" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">PV₀</text>
<rect x="594" y="208" width="89" height="44" rx="6" fill="#e9eefb" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="638.5" y="236" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">QK₁</text>
<rect x="688" y="208" width="89" height="44" rx="6" fill="#fff0cc" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="732.5" y="236" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">softmax₁</text>
<rect x="782" y="208" width="89" height="44" rx="6" fill="#e9eefb" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="826.5" y="236" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">PV₁</text>
<rect x="876" y="208" width="89" height="44" rx="6" fill="#e9eefb" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="920.5" y="236" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">QK₂</text>
<rect x="970" y="208" width="89" height="44" rx="6" fill="#fff0cc" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="1014.5" y="236" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">softmax₂</text>
<rect x="1064" y="208" width="89" height="44" rx="6" fill="#e9eefb" stroke="#a7b3bd" stroke-width="1.2"/>
<text x="1108.5" y="236" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#263238">PV₂</text>
<path d="M309 163 L309 205" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="322" y="188" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#263238">ready</text>
<path d="M594 207 L594 164" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="606" y="188" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#263238">A 可复用</text>
<path d="M218 290 L1190 290" fill="none" stroke="#637381" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="1190" y="314" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="15" text-anchor="end" font-weight="400" fill="#586975">逻辑时间 →（非实测比例）</text>
<text x="32" y="362" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="19" text-anchor="start" font-weight="400" fill="#263238">预取负责提前准备数据；softmax 不会因为 copy 异步而自动与本 tile 的 MMA 并行。</text>
<text x="32" y="397" font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#586975">A/B 是物理 buffer；下标 0/1/2/3 是逻辑 KV tile。实际实现可更早释放已读完的 K 或 V。</text>
</svg>
