}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;

  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {

}

  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;div class=&quot;viz-controls&quot;&gt;

    &lt;label class=&quot;form-label&quot;&gt;逻辑列段 q

        &lt;option value=&quot;0&quot;&gt;0 · col 0–7&lt;/option&gt;&lt;option value=&quot;1&quot;&gt;1 · col 8–15&lt;/option&gt;

      &lt;select class=&quot;form-select&quot; data-row aria-label=&quot;展开行 r&quot;&gt;
        &lt;option value=&quot;0&quot;&gt;r0&lt;/option&gt;&lt;option value=&quot;1&quot;&gt;r1&lt;/option&gt;&lt;option value=&quot;2&quot;&gt;r2&lt;/option&gt;&lt;option value=&quot;3&quot;&gt;r3&lt;/option&gt;
        &lt;option value=&quot;4&quot;&gt;r4&lt;/option&gt;&lt;option value=&quot;5&quot; selected&gt;r5&lt;/option&gt;&lt;option value=&quot;6&quot;&gt;r6&lt;/option&gt;&lt;option value=&quot;7&quot;&gt;r7&lt;/option&gt;

  &lt;div class=&quot;viz-row text-small&quot;&gt;&lt;span&gt;G：4 个 bank&lt;/span&gt;&lt;span&gt;着色格：16 B 行段&lt;/span&gt;&lt;span&gt;地址：相对 128 B 对齐基址&lt;/span&gt;&lt;/div&gt;

&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;ldmatrix-swizzle&#x27;);
  const swizzle = root.querySelector(&#x27;[data-swizzle]&#x27;);
  const chunk = root.querySelector(&#x27;[data-chunk]&#x27;);
  const row = root.querySelector(&#x27;[data-row]&#x27;);
  const grid = root.querySelector(&#x27;[data-grid]&#x27;);
  const status = root.querySelector(&#x27;[data-status]&#x27;);

  const words = root.querySelector(&#x27;[data-words]&#x27;);
  function render() {
    const q = Number(chunk.value), r = Number(row.value), useXor = swizzle.checked;
    const counts = Array(8).fill(0);
    let html = &#x27;&lt;div class=&quot;group-head text-small&quot;&gt;提供地址&lt;br&gt;偏移 / B&lt;/div&gt;&#x27;;
    for (let g = 0; g &lt; 8; ++g) html += &#x27;&lt;div class=&quot;group-head&quot;&gt;&lt;span&gt;G&#x27; + g + &#x27;&lt;/span&gt;&lt;span class=&quot;text-small bank-range&quot;&gt;&#x27; + (4*g) + &#x27;–&#x27; + (4*g+3) + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;
    for (let i = 0; i &lt; 8; ++i) {
      const g = useXor ? (q ^ i) : q;
      const address = 128*i + 16*g;
      counts[g]++;
      html += &#x27;&lt;div class=&quot;provider&quot;&gt;&lt;span&gt;T&#x27; + i + &#x27;&lt;/span&gt;&lt;span class=&quot;text-small&quot;&gt;&#x27; + address + &#x27; B&lt;/span&gt;&lt;/div&gt;&#x27;;
      for (let j = 0; j &lt; 8; ++j) {
        const active = j === g;
        html += &#x27;&lt;div class=&quot;bank-slot&#x27; + (active ? &#x27; occupied&#x27; : &#x27;&#x27;) + (active &amp;&amp; i === r ? &#x27; chosen&#x27; : &#x27;&#x27;) + &#x27;&quot;&#x27; + (active ? &#x27; data-tooltip=&quot;r&#x27; + i + &#x27; · 地址 &#x27; + address + &#x27; B · bank &#x27; + 4*g + &#x27;–&#x27; + (4*g+3) + &#x27;&quot;&#x27; : &#x27;&#x27;) + &#x27;&gt;&#x27; + (active ? &#x27;r&#x27; + i : &#x27;&#x27;) + &#x27;&lt;/div&gt;&#x27;;
      }
    }
    html += &#x27;&lt;div class=&quot;count text-small&quot;&gt;word 数&lt;br&gt;每 bank&lt;/div&gt;&#x27;;
    for (let g = 0; g &lt; 8; ++g) html += &#x27;&lt;div class=&quot;count&quot;&gt;&#x27; + counts[g] + &#x27;&lt;/div&gt;&#x27;;
    grid.innerHTML = html;
    status.textContent = useXor ? &#x27;无 bank conflict · 每个 bank 读取 1 个 word&#x27; : &#x27;8 路 bank conflict · 同组每个 bank 读取 8 个不同 word&#x27;;
    const g = useXor ? q ^ r : q;
    selected.textContent = &#x27;T&#x27; + r + &#x27; 提供 r&#x27; + r + &#x27; 地址 &#x27; + (128*r+16*g) + &#x27; B → G&#x27; + g + &#x27; → T&#x27; + 4*r + &#x27;–T&#x27; + (4*r+3) + &#x27; 接收&#x27;;
    words.innerHTML = Array.from({length:4}, (_,k) =&gt; &#x27;&lt;div class=&quot;word&quot;&gt;&lt;span&gt;T&#x27; + (4*r+k) + &#x27; · d&lt;/span&gt;&lt;span class=&quot;text-small&quot;&gt;bank &#x27; + (4*g+k) + &#x27; · 4 B&lt;/span&gt;&lt;div class=&quot;elements text-small&quot;&gt;&lt;span&gt;A[&#x27; + r + &#x27;,&#x27; + (8*q+2*k) + &#x27;]&lt;/span&gt;&lt;span&gt;A[&#x27; + r + &#x27;,&#x27; + (8*q+2*k+1) + &#x27;]&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&#x27;).join(&#x27;&#x27;);

  chunk.addEventListener(&#x27;change&#x27;, render);
  row.addEventListener(&#x27;change&#x27;, render);
  render();
})();
