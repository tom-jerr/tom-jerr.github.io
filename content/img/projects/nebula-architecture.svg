<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Nebula：向量检索组件</title>
<desc id="desc">graphd 经 RPC 访问 storaged，metad 提供 schema 和索引元数据。storaged 的内存 ANN 索引封装 HNSWlib 和 Faiss IVF；RocksDB 保存向量属性和 ID 映射，不是 ANN 图的存储容器。元数据接口以虚线表示。</desc>
