<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">MiniLSM：已实现的学习模块</title>
<desc id="desc">当前 master 的 scan 合并活跃与不可变 Memtable 的迭代器；另有 Block、SST 编解码和表迭代器模块。SST 尚未接入 scan，flush 仍有 unimplemented。两栏分别展示内存读取和表文件结构，不画成已完成的持久化 LSM 系统。</desc>
