<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">TinyKV：调度与 Raft 副本</title>
<desc id="desc">TinyScheduler 通过心跳和调度任务管理存储节点；图中仅展示同一 Region 的两个 Raft 副本，Leader 向 Follower 复制日志，节点使用 BadgerDB 持久化。两节点仅为局部示意，不代表完整集群或容错部署建议。虚线是调度控制接口，实线是复制与存储接口。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#172033"/></marker></defs>
