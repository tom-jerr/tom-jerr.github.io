<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-labelledby="title desc">
  <title id="title">DSpark cycle serial module</title>
  <desc id="desc">Serial head corrects logits and emits draft tokens with confidence</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .label{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .token{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .box{rx:8;fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .amber{fill:#fffbeb;stroke:#d97706}
      .green{fill:#ecfdf5;stroke:#059669}
      .line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="880" height="250" fill="#ffffff"/>
  <text x="32" y="38" class="label">Step 3: serial correction and confidence</text>
  <rect x="58" y="92" width="162" height="84" class="box amber"/>
  <text x="95" y="124" class="label">Base logits</text>
  <text x="91" y="152" class="small">U1, U2, U3, U4</text>
  <path d="M220 134 H305" class="line"/>
  <rect x="315" y="68" width="218" height="132" class="box amber"/>
  <text x="367" y="100" class="label">Serial head</text>
  <text x="350" y="130" class="small">autoregressive correction</text>
  <text x="362" y="154" class="small">D -> E -> F -> G -> H</text>
  <text x="366" y="178" class="small">confidence per position</text>
  <path d="M533 134 H615" class="line"/>
  <rect x="625" y="84" width="190" height="100" class="box green"/>
  <text x="674" y="116" class="label">Draft output</text>
  <text x="666" y="146" class="token">E  F  G  H</text>
  <text x="662" y="170" class="small">c1, c2, c3, c4</text>
</svg>
